/* SONDENGÄNGER: Feldbuch-Look. Dunkle Ackererde, Messing, Knochenweiß, Signalgrün wie das Display eines Detektors.
   Schrift: Big Shoulders Stencil für Titel (Munitionskisten-Schablone), Barlow Semi Condensed für alles andere. */
:root{
  --loam:#1b150e;
  --soil:#2a2016;
  --soil-2:#352919;
  --rim:#5d4a2c;
  --brass:#e0a93b;
  --brass-2:#f5cd6f;
  --bone:#f1e9d3;
  --muted:#b3a688;
  --sig:#8fe05a;
  --red:#e2553d;
  --blue:#7fc4e8;
  --ink:#120d08;
  --f-ui:"Barlow Semi Condensed","Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-head:"Big Shoulders Stencil Display","Barlow Condensed","Arial Narrow",sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--loam);color:var(--bone);font-family:var(--f-ui);overflow:hidden;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{display:block;width:100%;height:100%;touch-action:none}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud>*{pointer-events:none}
#hud button,#hud .stick{pointer-events:auto}
.hudtop{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 12px);display:flex;gap:8px;padding:0 calc(12px + var(--safe-r)) 0 calc(12px + var(--safe-l));align-items:flex-start}
.ibtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:rgba(27,21,14,.74);border:1px solid rgba(241,233,211,.28);padding:0;flex:none}
.ibtn svg{width:16px;height:16px}
.stats{margin-left:46px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;background:rgba(27,21,14,.78);border:1px solid rgba(241,233,211,.2);font-size:15px;font-weight:600;white-space:nowrap}
.chip b{font-family:var(--f-num);font-weight:700;font-size:17px;letter-spacing:.2px}
.chip.gold b{color:var(--brass-2)}
.xpbar{display:block;width:44px;height:6px;border-radius:3px;background:rgba(241,233,211,.18);overflow:hidden}
.xpbar b{display:block;height:100%;width:0;background:var(--brass);border-radius:3px}
#lcd{position:absolute;left:50%;top:calc(var(--safe-t) + 52px);transform:translateX(-50%);width:min(300px,calc(100vw - 24px));padding:7px 10px 8px;border-radius:12px;background:rgba(10,18,8,.82);border:1px solid rgba(143,224,90,.38);box-shadow:0 0 18px rgba(143,224,90,.08) inset;font-family:var(--f-num);color:var(--sig)}
#lcd .r1{display:flex;align-items:baseline;gap:10px}
#vdi{font-size:38px;line-height:1;font-weight:700;width:56px;text-align:right;text-shadow:0 0 10px rgba(143,224,90,.5);transition:opacity .2s}
#vlbl{font-size:16px;font-weight:600;letter-spacing:.4px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c4f0a2;text-transform:uppercase}
#depthTxt{font-size:16px;font-weight:600;color:var(--brass-2)}
.zones{position:relative;display:flex;height:7px;gap:2px;margin-top:6px}
.zones i{flex:1;border-radius:2px;opacity:.55}
.zones i:nth-child(1){background:#a8613a;flex:19}
.zones i:nth-child(2){background:#7d8790;flex:25}
.zones i:nth-child(3){background:#d6903f;flex:25}
.zones i:nth-child(4){background:#cfd8de;flex:20}
.zones i:nth-child(5){background:#f1cf4f;flex:10}
#zmark{position:absolute;top:-4px;width:2px;height:15px;background:#fff;box-shadow:0 0 6px #fff;left:0;transition:left .1s,opacity .2s;opacity:0}
.sigbar{height:6px;border-radius:3px;background:rgba(143,224,90,.14);margin-top:6px;overflow:hidden}
.sigbar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#4cae2c,#c4f05a);border-radius:3px}
#lcd .st{display:flex;gap:6px;margin-top:5px;font-size:13px;font-weight:600;letter-spacing:.5px;color:#7fae60;text-transform:uppercase}
#lcd .st span.on{color:var(--brass-2)}
#mapw{position:absolute;left:calc(12px + var(--safe-l));top:calc(var(--safe-t) + 160px);width:104px;height:104px;padding:0;border-radius:12px;overflow:hidden;background:#14100a;border:1px solid rgba(241,233,211,.38);box-shadow:0 2px 12px rgba(0,0,0,.45);pointer-events:auto}
#mapw.big{width:220px;height:220px}
#mapw canvas{display:block;width:100%;height:100%}
body.coachon #mapw{top:calc(var(--safe-t) + 268px)}
#dailyHint{position:absolute;right:calc(12px + var(--safe-r));top:calc(var(--safe-t) + 52px);max-width:132px;padding:6px 9px;border-radius:10px;background:rgba(27,21,14,.8);border:1px solid rgba(224,169,59,.5);font-size:13px;line-height:1.2;font-weight:600;color:var(--brass-2)}
#dailyHint small{display:block;color:var(--muted);font-weight:500;font-size:12px}
#coach{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 158px);width:min(420px,calc(100vw - 28px));padding:10px 14px;border-radius:12px;background:rgba(27,21,14,.9);border:1px solid var(--brass);font-size:17px;line-height:1.25;font-weight:600;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#coach b{color:var(--brass-2)}
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 150px);width:min(360px,calc(100vw - 24px));display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{padding:7px 12px;border-radius:10px;background:rgba(27,21,14,.88);border:1px solid rgba(241,233,211,.22);font-size:16px;font-weight:600;animation:tin .25s ease-out;text-align:center}
.toast.good{border-color:var(--brass);color:var(--brass-2)}
.toast.bad{border-color:var(--red)}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
#ringO{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid rgba(143,224,90,.9);opacity:0;box-shadow:0 0 14px rgba(143,224,90,.5)}
#arrowO{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
#arrowO i{position:absolute;left:-10px;top:-92px;width:0;height:0;border:10px solid transparent;border-bottom:22px solid var(--brass-2);border-top:0;filter:drop-shadow(0 0 6px rgba(0,0,0,.6))}
.stick{position:absolute;left:calc(18px + var(--safe-l));bottom:calc(var(--safe-b) + 22px);width:132px;height:132px;border-radius:50%;background:rgba(27,21,14,.38);border:2px solid rgba(241,233,211,.28);touch-action:none}
.stick #knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(241,233,211,.5);border:2px solid rgba(241,233,211,.7)}
.acts{position:absolute;right:calc(14px + var(--safe-r));bottom:calc(var(--safe-b) + 22px);width:170px;height:190px}
.abtn{position:absolute;border-radius:50%;border:2px solid rgba(241,233,211,.5);background:rgba(27,21,14,.64);color:var(--bone);font-family:var(--f-head);font-weight:800;letter-spacing:.6px;text-align:center;line-height:1.02;display:grid;place-items:center;padding:0;touch-action:none}
.abtn.on{background:var(--brass);color:var(--ink);border-color:var(--brass-2)}
#btnDig{right:0;bottom:0;width:96px;height:96px;font-size:21px;background:rgba(224,169,59,.88);color:var(--ink);border-color:var(--brass-2)}
#btnDig:active{transform:scale(.95)}
#btnPin{right:100px;bottom:8px;width:66px;height:66px;font-size:14px}
#btnFilter{right:6px;bottom:106px;width:60px;height:60px;font-size:13px}
#digBar{position:absolute;left:50%;bottom:calc(var(--safe-b) + 160px);width:140px;height:8px;margin-left:-70px;border-radius:4px;background:rgba(0,0,0,.45);overflow:hidden}
#digBar b{display:block;height:100%;width:0;background:var(--brass)}
.keyhelp{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 14px);font-size:14px;color:rgba(241,233,211,.7);background:rgba(27,21,14,.6);padding:5px 12px;border-radius:9px;white-space:nowrap}
.keyhelp b{color:var(--brass-2)}
body.touch .keyhelp{display:none}
body:not(.touch) .stick,body:not(.touch) .acts{display:none}
body.coachon #toasts{top:calc(var(--safe-t) + 232px)}
body:not(.touch) #digBar{bottom:56px}

/* ---------- Bildschirme ---------- */
#hub{background:linear-gradient(180deg,rgba(32,24,15,.9),rgba(20,15,9,.94))}
.screen{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,#33271a 0%,#1b150e 60%);display:flex;flex-direction:column;overflow:hidden;z-index:20}
.screen.clear{background:rgba(10,7,4,.72)}
.hubhead{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:calc(var(--safe-t) + 58px);padding:calc(var(--safe-t) + 10px) calc(14px + var(--safe-r)) 6px calc(104px + var(--safe-l))}
.logo{font-family:var(--f-head);font-weight:800;font-size:25px;white-space:nowrap;letter-spacing:1.5px;line-height:1;color:var(--bone)}
.logo span{color:var(--brass)}
.hstat{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tabs{display:flex;gap:6px;padding:4px calc(12px + var(--safe-r)) 8px calc(12px + var(--safe-l));overflow-x:auto;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:10px;background:var(--soil);border:1px solid var(--rim);font-size:16px;font-weight:600;color:var(--muted)}
.tab[aria-selected=true]{background:var(--brass);color:var(--ink);border-color:var(--brass-2)}
.tabbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px calc(14px + var(--safe-r)) calc(var(--safe-b) + 90px) calc(14px + var(--safe-l));-webkit-overflow-scrolling:touch;touch-action:pan-y}
.hubfoot{position:absolute;left:0;right:0;bottom:0;padding:10px 16px calc(var(--safe-b) + 12px);background:linear-gradient(0deg,#1b150e 55%,rgba(27,21,14,0));display:flex;gap:10px;justify-content:center}
.btn{min-height:46px;padding:0 20px;border-radius:12px;border:1px solid var(--rim);background:var(--soil-2);font-size:18px;font-weight:700;letter-spacing:.3px;color:var(--bone)}
.btn.primary{background:var(--brass);color:var(--ink);border-color:var(--brass-2);font-family:var(--f-head);font-weight:800;font-size:20px;letter-spacing:1px}
.btn.small{min-height:36px;padding:0 14px;font-size:16px}
.btn:disabled{opacity:.45;cursor:default}
.card{background:linear-gradient(180deg,var(--soil-2),var(--soil));border:1px solid var(--rim);border-radius:14px;padding:12px 14px;margin-bottom:10px;position:relative}
.card h3{margin:0 0 2px;font-family:var(--f-head);font-weight:800;font-size:22px;letter-spacing:.8px}
.card p{margin:2px 0 8px;color:var(--muted);font-size:16px;line-height:1.25}
.card .row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.card.daily{border-color:var(--brass);background:linear-gradient(180deg,#4a3715,#2c2113)}
.card.locked{opacity:.55}
.badge{display:inline-block;padding:2px 8px;border-radius:7px;background:rgba(224,169,59,.2);color:var(--brass-2);font-size:14px;font-weight:700;letter-spacing:.3px}
.badge.ok{background:rgba(143,224,90,.18);color:var(--sig)}
.badge.new{background:var(--red);color:#fff}
h4.sec{margin:14px 2px 6px;font-family:var(--f-head);font-weight:800;font-size:18px;letter-spacing:1px;color:var(--brass);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.fcard{background:var(--soil);border:1px solid var(--rim);border-radius:12px;padding:6px 6px 8px;text-align:center;font-size:14px;line-height:1.1;position:relative}
.fcard canvas{width:100%;aspect-ratio:1;display:block;border-radius:8px;background:radial-gradient(circle at 50% 40%,#4a3b25,#241b11)}
.fcard .nm{margin-top:5px;font-weight:600;overflow-wrap:anywhere;hyphens:auto}
.fcard .ct{position:absolute;top:4px;right:6px;font-family:var(--f-num);font-weight:700;font-size:14px;color:var(--brass-2);text-shadow:0 1px 2px #000}
.fcard.unk canvas{opacity:.28;filter:brightness(0)}
.fcard.unk .nm{color:var(--muted)}
.fcard.excl{border-color:var(--brass)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
.fchip{padding:5px 11px;border-radius:9px;background:var(--soil);border:1px solid var(--rim);font-size:15px;font-weight:600;color:var(--muted)}
.fchip[aria-pressed=true]{background:rgba(224,169,59,.25);color:var(--brass-2);border-color:var(--brass)}
.prog{height:8px;border-radius:4px;background:rgba(241,233,211,.12);overflow:hidden;margin:4px 0}
.prog b{display:block;height:100%;background:var(--brass);border-radius:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 4px}
.cal div{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:16px;background:var(--soil);border:1px solid transparent;color:var(--muted)}
.cal div.hd{aspect-ratio:auto;background:none;font-size:13px;color:var(--muted)}
.cal div.done{background:rgba(143,224,90,.2);border-color:var(--sig);color:var(--sig)}
.cal div.today{border-color:var(--brass);color:var(--brass-2)}
.cal div.void{background:none}
.road{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.road::-webkit-scrollbar{display:none}
.rw{flex:none;width:122px;padding:8px;border-radius:12px;background:var(--soil);border:1px solid var(--rim);font-size:14px;line-height:1.15;text-align:center}
.rw b{display:block;font-family:var(--f-num);font-size:18px;color:var(--brass-2)}
.rw.got{border-color:var(--sig);opacity:.7}
.rw.next{border-color:var(--brass)}
.eq{display:flex;gap:10px;align-items:center}
.eq .ic{flex:none;width:44px;height:44px;border-radius:10px;background:#16110a;border:1px solid var(--rim);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:20px;color:var(--brass-2)}
.eq .tx{flex:1;min-width:0}
.eq .tx b{display:block;font-size:18px}
.eq .tx span{display:block;color:var(--muted);font-size:14px;line-height:1.2}
.skin{width:26px;height:26px;border-radius:50%;display:inline-block;vertical-align:middle;border:2px solid rgba(255,255,255,.3);margin-right:6px}
.opt{display:flex;width:100%;justify-content:space-between;align-items:center;padding:13px 14px;margin-bottom:8px;border-radius:12px;background:var(--soil);border:1px solid var(--rim);font-size:18px;font-weight:600;text-align:left}
.opt b{color:var(--brass-2)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:16px;color:var(--muted);margin:6px 0}
.keys b{color:var(--bone)}
.hero{padding:calc(var(--safe-t) + 4px) 0 4px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
.stat3 div{background:var(--soil);border:1px solid var(--rim);border-radius:10px;padding:6px 8px;text-align:center;font-size:13px;color:var(--muted)}
.stat3 div b{display:block;font-family:var(--f-num);font-size:22px;color:var(--bone)}

/* ---------- Fundfenster ---------- */
#fp{align-items:center;justify-content:center;padding:calc(var(--safe-t) + 10px) 14px calc(var(--safe-b) + 10px)}
.fbox{width:min(400px,100%);max-height:100%;overflow-y:auto;background:linear-gradient(180deg,#3a2c19,#241a0f);border:2px solid var(--brass);border-radius:18px;padding:14px 14px 16px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.fbox h2{margin:0;font-family:var(--f-head);font-weight:800;font-size:28px;letter-spacing:1px;line-height:1.05}

.fbox .desc{font-size:17px;line-height:1.3;margin:6px 4px 8px}
.fbox .meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.fbox .val{font-family:var(--f-num);font-weight:700;font-size:30px;color:var(--brass-2)}
.fbox .brush{color:var(--muted);font-size:16px;margin:4px 0}
.fbox .acts2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#fProg{height:8px;border-radius:4px;background:rgba(241,233,211,.14);margin:8px 18px;overflow:hidden}
#fProg b{display:block;height:100%;width:0;background:var(--sig)}
.ribbon{display:inline-block;background:var(--red);color:#fff;font-family:var(--f-head);font-weight:800;letter-spacing:1px;padding:2px 12px;border-radius:6px;margin-bottom:6px;font-size:18px}
.modalbox{width:min(400px,100%);background:linear-gradient(180deg,#3a2c19,#241a0f);border:2px solid var(--brass);border-radius:18px;padding:16px;text-align:center}
.modalbox h2{margin:0 0 6px;font-family:var(--f-head);font-weight:800;font-size:28px;letter-spacing:1px}

.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--loam);z-index:60;font-family:var(--f-head);font-weight:800;font-size:26px;letter-spacing:1.5px;color:var(--brass)}

@media (max-height:520px) and (orientation:landscape){
  #lcd{top:calc(var(--safe-t) + 48px);width:250px}
  #mapw,body.coachon #mapw{top:calc(var(--safe-t) + 52px);width:84px;height:84px}
  #mapw.big{width:176px;height:176px}

  #btnDig{width:84px;height:84px}

  #btnFilter{bottom:92px}

  body.coachon #toasts{top:calc(var(--safe-t) + 150px)}
}
</style>

    L2.depth = (G.pin && S.gear.pin >= 1 && sn.sig > .22 && sn.best) ? '~' + Math.max(1, Math.round(sn.best.depth * 100 + (Math.random() + Math.random() - 1) * (S.gear.pin >= 2 ? 1.4 : 4) * (1 - sn.sig * .6))) + ' cm' : '';

  $('vdi').style.opacity = show ? 1 : .35;

  $('stRun').textContent = run ? 'Rennen' : ''; $('stRun').className = run ? 'on' : '';

  } else ar.style.opacity = 0;

// START
