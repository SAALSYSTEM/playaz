<style>
/* STAMMVÖLKER: warme Low-Poly-Welt. Farben aus der Palette (Papier, Tinte, Terrakotta, Türkis). */
:root{
  --paper:#FFF6E6;
  --paper-2:#F1E2C6;
  --ink:#3A2E25;
  --ink-2:#6B5544;
  --terra:#E07A3A;
  --terra-d:#B85A22;
  --teal:#2F9C95;
  --green:#4CAF6A;
  --font:"Fredoka","Arial Rounded MT Bold",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,#8ccaf0 0%,#c8e6f5 38%,#e9f2f2 62%,#f6efe1 100%);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{display:block;width:100%;height:100%;touch-action:none}

/* Ressourcenleiste */
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;gap:5px;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 0 58px;pointer-events:none}
.pill{display:flex;align-items:center;gap:4px;height:32px;padding:0 9px 0 5px;background:var(--paper);border-radius:999px;box-shadow:0 3px 0 rgba(58,46,37,.18),0 8px 18px rgba(58,46,37,.12);font:700 16px/1 var(--font);font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.pill svg{width:22px;height:22px;flex:none}
.pill small{font-weight:500;font-size:14px;color:var(--ink-2)}
.pill[hidden]{display:none}
@media (max-width:430px){.hud{gap:3px;padding-right:4px;justify-content:flex-start;padding-left:98px}.pill{font-size:12.5px;height:30px;padding:0 5px 0 3px;gap:1px}.pill svg{width:15px;height:15px}.pill small{font-size:11px}}
.bump{animation:bump .3s ease-out}
@keyframes bump{0%{transform:scale(1.18)}100%{transform:scale(1)}}

.tag{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 58px);height:28px;padding:0 12px;border:0;border-radius:999px;background:rgba(58,46,37,.74);color:var(--paper);font:600 13px/1 var(--font);letter-spacing:.04em;cursor:pointer}
.season-badge{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 58px);display:flex;align-items:center;gap:6px;padding:4px 12px 4px 6px;border-radius:999px;background:rgba(255,246,230,.88);font:600 14px/1 var(--font);color:var(--ink);pointer-events:none;box-shadow:0 2px 0 rgba(58,46,37,.12)}
.season-badge i{width:18px;height:18px;border-radius:50%;background:var(--green)}
.season-badge small{font:500 13px/1 var(--font);color:var(--ink-2)}
.season-badge.meal{top:calc(env(safe-area-inset-top,0px) + 92px);padding:4px 12px;transition:background .3s,color .3s}
.season-badge.meal.warn{background:#c23a1e;color:#fff}
.season-badge.meal.warn small{color:#ffe3d8}

/* Untere Leiste */
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;justify-content:center;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 14px)}
.b{height:52px;min-width:52px;padding:0 14px;border:0;border-radius:16px;background:var(--paper);color:var(--ink);font:700 17px/1.05 var(--font);box-shadow:0 5px 0 #d8c39c,0 10px 20px rgba(58,46,37,.16);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s ease}
.b:active{transform:translateY(3px);box-shadow:0 2px 0 #d8c39c,0 6px 12px rgba(58,46,37,.14)}
.b svg{width:24px;height:24px;flex:none}
.b.main{flex:1;max-width:220px;background:var(--terra);color:#fff;box-shadow:0 5px 0 var(--terra-d),0 12px 24px rgba(184,90,34,.32)}
.b.main:active{box-shadow:0 2px 0 var(--terra-d),0 6px 12px rgba(184,90,34,.3)}
.b.main span{display:block;font:500 13px/1 var(--font);opacity:.92;margin-top:3px}
.b.main.on{background:var(--teal);box-shadow:0 5px 0 #1f6f6a,0 12px 24px rgba(47,156,149,.32)}
.b.main.poor{filter:saturate(.55) brightness(.97)}
.b.season{flex:1;max-width:150px}
.b:focus-visible{outline:4px solid var(--teal);outline-offset:3px}
.shake{animation:shake .38s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* Bauauswahl */
.sheet{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);scroll-padding:0 12px;display:flex;gap:8px;overflow-x:auto;padding:8px 12px 12px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet::before,.sheet::after{content:"";margin:auto}
.card{flex:none;width:120px;padding:9px 10px 10px;border:0;border-radius:16px;background:var(--paper);color:var(--ink);text-align:left;font-family:var(--font);box-shadow:0 5px 0 #d8c39c,0 10px 20px rgba(58,46,37,.18);cursor:pointer;scroll-snap-align:start}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #d8c39c,0 6px 12px rgba(58,46,37,.14)}
.card b{display:block;font:700 16px/1.1 var(--font)}
.card small{display:block;margin-top:3px;min-height:30px;font:500 12px/1.25 var(--font);color:var(--ink-2)}
.card .hi{display:block;width:44px;height:30px;margin-bottom:4px}
.card .cost{display:flex;flex-wrap:wrap;gap:2px 8px;margin-top:5px;font:700 14px/1 var(--font)}
.card .cost span{display:flex;align-items:center;gap:2px}
.card .cost svg{width:16px;height:16px;flex:none}
.card .cost .lack{color:#c23a1e}
.card.poor{filter:saturate(.55)}
.card:focus-visible{outline:4px solid var(--teal);outline-offset:2px}

/* Hinweise */
.chip{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);transform:translateX(-50%);max-width:calc(100% - 24px);padding:9px 16px;background:var(--paper);border-radius:16px;box-shadow:0 4px 0 rgba(58,46,37,.16),0 12px 26px rgba(58,46,37,.16);font:500 16px/1.25 var(--font);color:var(--ink);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}

.chip.act{pointer-events:auto}
.chip .up{display:inline-flex;align-items:center;gap:6px;margin-left:8px;padding:7px 12px;border:0;border-radius:999px;background:var(--terra);color:#fff;font:700 15px/1 var(--font);cursor:pointer;box-shadow:0 3px 0 var(--terra-d);vertical-align:middle}
.chip .up:active{transform:translateY(2px);box-shadow:0 1px 0 var(--terra-d)}
.chip .up span{display:inline-flex;align-items:center;gap:2px}
.chip .up svg{width:16px;height:16px}
.chip .up .lack{color:#ffd9cc}
.chip:has(.tech){white-space:normal}
.chip .tech{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.chip .tech .up{margin:0}
.chip .up.off{background:#EFE2C6;color:var(--ink);box-shadow:0 3px 0 #d8c39c}
.chip .up small{font:600 12px/1 var(--font);opacity:.85}
.chip .stats{margin-top:6px;font-size:14px;color:var(--ink-2)}
.chip .stats .bad{color:#b8452a;font-weight:700}
.chip:has(.stats),.chip:has(.tech){white-space:normal;width:min(calc(100% - 24px),370px)}
.chip .up:disabled{opacity:.55;box-shadow:none}
.chip .gain{color:var(--ink-2);font-size:14px}
.chip.in{animation:chipIn .25s ease-out}
@keyframes chipIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.toast{position:absolute;left:50%;top:30%;padding:12px 22px;background:var(--paper);border-radius:20px;box-shadow:0 6px 0 rgba(58,46,37,.16),0 18px 40px rgba(58,46,37,.2);font:700 22px/1.15 var(--font);color:var(--ink);text-align:center;white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-50%)}
.toast small{display:block;font:500 15px/1.3 var(--font);color:var(--ink-2)}
.toast.show{animation:toast 2.4s ease-out forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
.floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;left:0;top:0;padding:3px 9px;border-radius:999px;background:rgba(255,246,230,.95);font:700 15px/1 var(--font);color:var(--ink);white-space:nowrap;box-shadow:0 2px 0 rgba(58,46,37,.18);will-change:transform,opacity}
.float.wood{color:#8C5A31}
.float.stone{color:#5c6470}
.float.iron{color:#3d4a5c}
.float.tools{color:#3d4a5c}
.float.food{color:#b8452a}
.hint{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 134px);transform:translateX(-50%);padding:7px 14px;border-radius:999px;background:rgba(58,46,37,.78);color:var(--paper);font:500 14px/1.2 var(--font);white-space:nowrap;pointer-events:none;transition:opacity .6s}
.hint.out{opacity:0}


/* Startbild */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,20px);padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 22px);background:radial-gradient(120% 80% at 50% 0%,#fffaf1 0%,#fbefd9 55%,#f1dcb8 100%);overflow:auto;transition:opacity .5s ease,visibility .5s}
.screen.out{opacity:0;visibility:hidden}
.title{margin:0;font:700 clamp(40px,11vw,64px)/.95 var(--font);letter-spacing:.02em;color:var(--terra);text-shadow:0 3px 0 var(--terra-d),0 8px 18px rgba(184,90,34,.25);text-align:center}
.sub{margin:-4px 0 0;font:600 clamp(15px,4vw,18px)/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.poster{width:min(88vw,520px);aspect-ratio:16/9;flex:none;border-radius:22px;overflow:hidden;border:5px solid #fff;background:#d7ecf6;box-shadow:0 10px 0 rgba(58,46,37,.08),0 20px 40px rgba(58,46,37,.22);transform:rotate(-1.2deg)}
.poster img{display:block;width:100%;height:100%;object-fit:cover}
.lead{margin:0;max-width:32ch;text-align:center;font:500 clamp(16px,4.3vw,19px)/1.35 var(--font);color:var(--ink-2);text-wrap:balance}
.go{min-width:min(78vw,320px);height:62px;padding:0 24px;border:0;border-radius:20px;background:var(--terra);color:#fff;font:700 26px/1 var(--font);box-shadow:0 7px 0 var(--terra-d),0 16px 28px rgba(184,90,34,.32);cursor:pointer}
.go:active{transform:translateY(4px);box-shadow:0 3px 0 var(--terra-d),0 8px 16px rgba(184,90,34,.28)}
.small{margin:0;font:500 13px/1.35 var(--font);color:#8a7562;text-align:center}
</style>

<script>
(() => {
'use strict';
const T = THREE;
const $ = s => document.querySelector(s);
const C = h => new T.Color(h).convertSRGBToLinear();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- Zufall mit festem Startwert: die Welt sieht bei jedem Laden gleich aus ----------
let seed = 20261014;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = (a, b) => a + (b - a) * rnd();
const pick = arr => arr[Math.floor(rnd() * arr.length)];

// ---------- Renderer ----------
const canvas = $('#c');
let renderer;
try {
  renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
} catch (e) {
  document.body.innerHTML = '<p style="font:500 18px/1.4 Fredoka,sans-serif;padding:24px;text-align:center">Dein Browser kann leider kein WebGL anzeigen.</p>';
  return;
}
let pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(pixelRatio);
renderer.outputEncoding = T.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.setClearColor(0x000000, 0);

const scene = new T.Scene();
const FOG = '#e3eef2';
scene.fog = new T.Fog(C(FOG), 44, 72);

const cam = new T.OrthographicCamera(-10, 10, 10, -10, 0.1, 200);
const startZoom = innerWidth < innerHeight ? 1.6 : 1.0;
const camS = { az: Math.PI / 4, azT: Math.PI / 4, el: 0.58, zoom: startZoom, zoomT: startZoom, target: new T.Vector3(0.6, 0, -1.2) };

// ---------- Licht: Sonne von links oben ----------
const hemi = new T.HemisphereLight(C('#dfefff'), C('#a88b6a'), 0.78);
scene.add(hemi);
const sun = new T.DirectionalLight(C('#fff1dc'), 1.1);
sun.position.set(-11, 16, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: 1, far: 45 });
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.025;
scene.add(sun, sun.target);

// ---------- Material-Helfer ----------
const matCache = {};
const M = (hex, o) => {
  const k = hex + (o ? JSON.stringify(o) : '');
  return matCache[k] || (matCache[k] = new T.MeshStandardMaterial(Object.assign({ color: C(hex), flatShading: true, roughness: 0.92, metalness: 0 }, o || {})));
};
const dummy = new T.Object3D();

// Teile zu einer Geometrie zusammenfügen (mit Farben je Teil), damit viele Objekte nur einen Zeichenaufruf brauchen
function merge(parts) {
  const pos = [], col = [];
  for (const [g, m, hex] of parts) {
    const gg = g.index ? g.toNonIndexed() : g.clone();
    if (m) gg.applyMatrix4(m);
    const a = gg.attributes.position.array;
    const c = C(hex || '#ffffff');
    for (let i = 0; i < a.length; i += 3) { pos.push(a[i], a[i + 1], a[i + 2]); col.push(c.r, c.g, c.b); }
  }
  const out = new T.BufferGeometry();
  out.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  out.setAttribute('color', new T.Float32BufferAttribute(col, 3));
  out.computeVertexNormals();
  return out;
}
const mtx = (x, y, z, rx, ry, rz, sx, sy, sz) => {
  dummy.position.set(x || 0, y || 0, z || 0);
  dummy.rotation.set(rx || 0, ry || 0, rz || 0);
  dummy.scale.set(sx || 1, sy === undefined ? (sx || 1) : sy, sz === undefined ? (sx || 1) : sz);
  dummy.updateMatrix();
  return dummy.matrix.clone();
};

// Viele gleiche Objekte als ein InstancedMesh
function instanced(geo, mat, items, { cast = true, receive = true } = {}) {
  // eigenes Material je InstancedMesh (Shader mit Instanz-Farben darf nicht mit normalen Meshes geteilt werden)

function animPerson(u, anim, ph) {
  let lw = 0, ar = 0, al = 0, bob = 0, lean = 0, sit = 0;
  if (anim === 'walk' || anim === 'carry') { const s = Math.sin(ph * 9); lw = s * 0.62; ar = anim === 'carry' ? -2.6 : -s * 0.55; al = s * 0.55; bob = Math.abs(Math.cos(ph * 9)) * 0.016; }
  else if (anim === 'run') { const s = Math.sin(ph * 14); lw = s * 0.8; ar = -s * 0.8; al = s * 0.8; bob = Math.abs(Math.cos(ph * 14)) * 0.025; }
  else if (anim === 'chop') { const c = (ph * 1.4) % 1; ar = c < 0.65 ? -2.6 + c / 0.65 * 0.4 : -2.2 + (c - 0.65) / 0.35 * 1.8; al = -0.6; lean = c < 0.65 ? -0.08 : 0.15; }
  else if (anim === 'hammer') { ar = -1.1 + Math.sin(ph * 13) * 0.55; al = -0.5; lean = 0.22; }
  else if (anim === 'gather') { lean = 0.5; ar = -0.9 + Math.sin(ph * 5) * 0.35; al = -0.75; }
  else if (anim === 'sit' || anim === 'fish') { sit = 1; ar = anim === 'fish' ? -0.95 : Math.sin(ph * 1.5) * 0.05 - 0.2; al = anim === 'fish' ? -0.9 : -0.2; }
  else { ar = Math.sin(ph * 2) * 0.04; al = -ar; bob = Math.sin(ph * 2) * 0.003; }
  u.lL.rotation.x = sit ? -1.45 : lw; u.lR.rotation.x = sit ? -1.45 : -lw;
  u.aR.rotation.x = ar; u.aL.rotation.x = al;
  u.up.rotation.x = lean;
  u.all.position.y = bob - sit * 0.11;
}

  a.leaving = true; a.q = [{ t: 'walk', to: V(14 - 5.5, 0, 4.6 - 5.5 + R(-0.6, 0.6)), speed: 0.7 }, { t: 'do', fn: () => { scene.remove(a.o); const i = agents.indexOf(a); if (i >= 0) agents.splice(i, 1); } }]; a.cur = null; a.plan = () => [{ t: 'wait', d: 5 }];

}

  const ex = e.target.closest('[data-explore]'); if (ex) { explore(ex.dataset.explore); return; } if (e.target.closest('[data-town]')) { upgradeTown(); return; } const rd = e.target.closest('[data-road]'); if (rd) { const [x, z] = rd.dataset.road.split(',').map(Number), b = builtAt(x, z); if (b) connectHut(b); return; } const th = e.target.closest('[data-tech]'); if (th) { research(th.dataset.tech); return; } const u = e.target.closest('[data-up]'); if (!u) return; const [x, z] = u.dataset.up.split(',').map(Number), b = builtAt(x, z); if (b) upgrade(b); });

// ---------- Speichern (nur in diesem Browser) ----------
const KEY = 'stammvoelker.v1';
let resetting = false;
function save() {
  if (resetting) return;
  try {
    const f2 = v => Math.round(v * 100) / 100;
    localStorage.setItem(KEY, JSON.stringify({
      v: 1, map: 2, wood: state.wood, stone: state.stone, food: state.food, iron: state.iron, tools: state.tools, pop: state.pop, cap: state.cap, m: Math.round(meal.t), h: meal.hungry, z: zones.filter(z => !z.fog).map(z => z.id),
      r: town.lvl, w: [...roads], k: [...know], n: ration.n, wv: 2, b: built.map(b => [b.kind, b.x, b.z, b.lvl, b.paused ? 1 : 0, b.free ? 1 : 0]),
      s: sites.filter(s => !s.done).map(s => [s.kind, s.tile.x, s.tile.z]),
      t: trees.filter(tr => !tr.fell).map(tr => [tr.tile.x, tr.tile.z, f2(tr.ox), f2(tr.oz), tr.kind === 'c' ? 0 : 1, f2(tr.s), f2(tr.ry), f2(tr.g), f2(tr.tint)])
    }));
  } catch (e) { /* Speicher voll oder gesperrt: Spiel läuft trotzdem */ }
}
function load() {
  if (/[?&]neu\b/.test(location.search)) { try { localStorage.removeItem(KEY); } catch (e) { /* egal */ } return; }
  let o = null;
  try { o = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return; }
  if (!o || o.v !== 1) return;
  const num = (v, d) => Number.isFinite(v) ? Math.max(0, Math.min(99999, Math.round(v))) : d;
  state.wood = num(o.wood, state.wood); state.stone = num(o.stone, state.stone); state.food = num(o.food, state.food); state.iron = num(o.iron, 0); state.tools = num(o.tools, 0);
  state.pop = Math.max(1, num(o.pop, state.pop)); state.cap = Math.max(state.pop, num(o.cap, state.cap));
  for (const id of Array.isArray(o.z) ? o.z : []) { const z = zones.find(q => q.id === id); if (z && z.fog) openZone(z, true); }
  state.food = Math.min(state.food, Math.max(60, state.pop * 16));
  if (Number.isFinite(o.m)) meal.t = clamp(o.m, 1, MEAL_SEC); if (Number.isFinite(o.h)) meal.hungry = clamp(Math.round(o.h), 0, 9);
  if (Array.isArray(o.t)) {
    const ok = o.t.filter(r => Array.isArray(r) && r.length >= 9 && r.every(Number.isFinite)).slice(0, MAXT - 6);
    if (o.map === 2) trees.length = 0; else for (let i = trees.length - 1; i >= 0; i--) if (!trees[i].tile.nw) trees.splice(i, 1);
    for (const r of ok) { const t = tileAt(r[0], r[1]); if (t && t.ch !== 'w') addTree(t, clamp(r[2], -0.45, 0.45), clamp(r[3], -0.45, 0.45), r[4] ? 'l' : 'c', { s: clamp(r[5], 0.5, 1.6), ry: r[6], g: clamp(r[7], 0, 1), tint: clamp(r[8], 0.7, 1.2) }); }
  }
  if (Array.isArray(o.k)) o.k.forEach(id => { if (TECH[id]) know.add(id); });
  else { // alter Spielstand: bereits Gebautes gilt als erforscht
    if (Array.isArray(o.b)) for (const r of o.b) { const id = Array.isArray(r) && techFor(r[0]); if (id) know.add(id); if (Array.isArray(r) && r[3] > 1) know.add('ausbau'); }
    if (know.has('smithy') || know.has('schmieden')) know.add('bergbau');
  }
  for (const r of Array.isArray(o.b) ? o.b : []) {
    if (!Array.isArray(r)) continue;
    const [k, x, z] = r, t = tileAt(x, z);
    if (!KINDS.includes(k) || !t || !okTile(k, t) || t.occ) continue;
    const g = placeBuilding(k, x, z, false), lvl = clamp(Math.round(r[3]) || 1, 1, UPG_MAX);
    built.push({ kind: k, x, z, lvl, g, paused: r[4] === 1, free: r[5] === 1 }); g.scale.setScalar(lvlScale(lvl)); if (k === 'bruecke') openWest(true);
    if (k !== 'tent' && k !== 'bruecke') spawnWorker(k, x, z);
  }
  for (const r of Array.isArray(o.s) ? o.s : []) {
    if (!Array.isArray(r)) continue;
    const [k, x, z] = r, t = tileAt(x, z);
    if (!KINDS.includes(k) || !t || !okTile(k, t) || t.occ) continue;
    t.occ = 'site'; sites.push(makeSite(t, k));
  }
  if (RATION[o.n]) ration.n = o.n;
  if (Number.isFinite(o.r)) setTown(Math.round(o.r), true);
  else { // alter Spielstand: Gebiet so groß, dass alles Gebaute drin liegt
    const far = [...built, ...sites.map(q => q.tile)].reduce((m, b) => Math.max(m, Math.hypot(b.x - VILLAGE.fire[0], b.z - VILLAGE.fire[1])), 0);
    setTown(far <= TOWN_R[1] ? 1 : far <= TOWN_R[2] ? 2 : 3, true);
  }
  computeConn();
  if (Array.isArray(o.w)) { o.w.forEach(k => { const t = typeof k === 'string' && tileAt(...k.split(',').map(Number)); if (t && t.ch !== 'w' && !t.occ) roads.add(key(t)); }); }
  else built.forEach(b => { if (!NEEDS_ROAD.includes(b.kind)) return; const p = autoPath(b); if (p) { p.forEach(k => roads.add(k)); computeConn(); } }); // alter Spielstand: Wege geschenkt
  if (o.wv !== 2) { computeConn(); built.forEach(b => { if (b.conn === false) b.free = true; }); } // vor den Wegen gebaut: gilt als angeschlossen
  for (let i = 0; i < Math.min(10, state.pop - 12); i++) person({ ...look(), shirt: pick(['#E6CC9E', '#C9A876', '#E07A3A']), sash: pick(['#2F9C95', '#E07A3A']), tool: 'basket' }, gathererPlan, firePos.x + R(-0.8, 0.8), firePos.z + R(0.4, 1.0), { name: 'Bewohner' }).res = true;
}

let hintGone = false;
function hideHint() { if (hintGone) return; hintGone = true; setTimeout(() => $('#hint').classList.add('out'), 2500); }

// ---------- Startbild ----------
let started = false;
$('#goBtn').addEventListener('click', () => {
  started = true; $('#start').classList.add('out');
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  setTimeout(() => { if (!hintGone) hideHint(); }, 6000);
  setTimeout(() => chip('Tippe auf <b>Bauen</b>. Holz bringen die Holzfäller'), 900);
  setTimeout(() => { if (zones.some(z => z.fog)) chip('Im <b>Nebel</b> liegt unentdecktes Land. Tippe darauf', 6000); }, 25000);
});
if (/[?&]direkt\b/.test(location.search)) { started = true; $('#start').classList.add('out'); }

// ---------- Hauptschleife ----------
let saveT = 0;
let last = performance.now(), time = 0, frames = 0, fpsT = 0, quality = 2;
const DT_MAX = /[?&]test\b/.test(location.search) ? 0.5 : 0.05;
const flagArr = flagGeo.attributes.position.array;
function tick(now) {
  const dt = Math.min(DT_MAX, (now - last) / 1000); last = now; time += dt;
  updateCamera(dt);
  agents.forEach(a => a.update(dt));
  updateFoam(dt);
  fallTex.offset.y = (fallTex.offset.y + dt * 1.25) % 1;
  cloudGroup.rotation.y += dt * 0.008;
  // Feuer flackert
  flames.forEach((f, i) => { const k = 0.85 + Math.sin(time * (11 + i * 3) + i) * 0.12 + Math.sin(time * 23 + i * 2) * 0.06; f.scale.set(1, k, 1); f.rotation.y = time * (1 + i); });
  fireLight.intensity = 1.05 + Math.sin(time * 13) * 0.14 + Math.sin(time * 29) * 0.08;
  smoke.forEach(s => { s.userData.t = (s.userData.t + dt * 0.22) % 1; const k = s.userData.t; s.position.set(Math.sin(k * 6 + time * 0.5) * 0.06, 0.3 + k * 1.3, Math.cos(k * 5) * 0.05); s.scale.setScalar(0.6 + k * 2.2); s.material.opacity = 0.42 * (1 - k) * Math.min(1, k * 6); });
  // Fahne weht
  for (let i = 0; i < flagArr.length; i += 3) { const x = flagBase[i]; flagArr[i + 2] = Math.sin(x * 10 - time * 5) * 0.045 * (x / 0.56) + Math.sin(x * 5 - time * 3) * 0.02 * (x / 0.56); }
  flagGeo.attributes.position.needsUpdate = true; flagGeo.computeVertexNormals();
  // Pose und Fischsprung
  bob.position.y = floatPos.y + Math.sin(time * 3) * 0.008;
  if (fishJump.t >= 0) {
    fishJump.t += dt; const k = fishJump.t / 0.65;
    if (k >= 1) { fishJump.t = -1; fishMesh.visible = false; ripple(V(floatPos.x + 0.25, 0, floatPos.z)); }
    else { fishMesh.position.set(floatPos.x + k * 0.25, WATER_Y + Math.sin(k * Math.PI) * 0.42, floatPos.z); fishMesh.rotation.set(0, Math.PI / 2, -0.5 + k * 2.2); }
  }
  if (Math.random() < dt * 0.25) ripple(V(floatPos.x + R(-0.1, 0.1), 0, floatPos.z + R(-0.1, 0.1)));
  // Effekte
  for (let i = effects.length - 1; i >= 0; i--) { const e = effects[i]; e.t += dt; const k = Math.min(1, e.t / e.d); e.f(e, k, dt); if (k >= 1) { scene.remove(e.m); e.m.material.dispose(); effects.splice(i, 1); } }
  for (let i = popIns.length - 1; i >= 0; i--) { const p = popIns[i]; p.t += dt / 0.55; const k = Math.min(1, p.t); p.obj.scale.setScalar(Math.max(0.001, easeOutBack(k)) * 1.18); if (k >= 1) popIns.splice(i, 1); }
  if (sel.visible) { selT += dt; sel.scale.setScalar(1 + Math.max(0, 0.12 - selT * 0.6)); }
  if (buildMode) hlMat.opacity = 0.5 + Math.sin(time * 5) * 0.18;
  updateSeason(dt); updateSeasonClock(dt);
  updateTrees(dt); updateFog(dt);
  if (started) { checkArrivals(dt); updateMeal(dt); saveT += dt; if (saveT > 8) { saveT = 0; save(); } }
  updatePrecip(dt, time);
  updateFloats(dt);
  renderer.render(scene, cam);
  // Leistung prüfen: bei ruckeligen Geräten Auflösung und Schatten reduzieren
  if (started && DT_MAX < 0.1) { frames++; fpsT += dt; if (fpsT > 3) { const fps = frames / fpsT; frames = 0; fpsT = 0; if (fps < 38 && quality > 0) degrade(); } }
  requestAnimationFrame(tick);
}
function degrade() {
  quality--;
  if (quality === 1) { pixelRatio = Math.min(pixelRatio, 1.25); renderer.setPixelRatio(pixelRatio); resize(); }
  if (quality === 0) { renderer.shadowMap.type = T.PCFShadowMap; sun.shadow.mapSize.set(1024, 1024); sun.shadow.map && sun.shadow.map.dispose(); sun.shadow.map = null; pixelRatio = 1; renderer.setPixelRatio(1); resize(); }
}

if (/[?&]test\b/.test(location.search)) window.__sv = { sites, siteFirst, siteChip, ration, roads, computeConn, autoPath, connectHut, town, setTown, inTerr, know, TECH, routeTo, zones, openZone, state, tiles, trees, built, BUILD, setSeason, seasons: SEASONS, seasonNow, save, buildNow: (k, x, z) => { const t = tileAt(x, z); t.occ = 'site'; const st = makeSite(t, k); st.progress = 1; finishSite(st); }, screenOf: (x, z) => { const t = tileAt(x, z); const v = V(t.wx, t.top, t.wz).project(cam); return [(v.x * 0.5 + 0.5) * innerWidth, (-v.y * 0.5 + 0.5) * innerHeight]; }, cam: camS, info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, programs: renderer.info.programs.length }) };
setTown(1, true);
load();
computeConn();
rebuildTrees();
setSeason(seasonNow(), true);
updateHud();
resize();
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
requestAnimationFrame(t => { last = t; tick(t); });
})();
