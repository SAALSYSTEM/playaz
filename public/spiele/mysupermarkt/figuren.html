<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>MySupermarkt · Figuren in 360° · PlaySaal</title>
<link rel="icon" href="../../favicon.ico"><link rel="stylesheet" href="../../assets/fonts.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#e5efe5;color:#184e45;font:16px Barlow,system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:20px max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom));}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font:600 clamp(24px,5vw,38px) Fredoka,system-ui;margin:6px 0}p{line-height:1.4}a{color:inherit}header a{white-space:nowrap;font-weight:700}.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:800}section{position:relative;overflow:hidden;border-radius:24px;background:#c3e3d4;box-shadow:0 16px 50px #184e451a}canvas{display:block;width:100%;height:min(57dvh,560px);min-height:280px;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.caption{position:absolute;bottom:8px;left:0;right:0;text-align:center;pointer-events:none;font-size:12px;color:#174e45}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:18px 0}label{font-size:12px;font-weight:700}select,button{font:inherit;min-height:44px;border-radius:12px;border:1px solid #a8c1ae;background:#fff9e9;color:#184e45;padding:9px 12px}select{display:block;width:100%;margin-top:5px}button{cursor:pointer;font-weight:700}.turn{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.turn button{flex:1}#spin{background:#ffd13e}input[type=range]{width:100%;margin:16px 0;accent-color:#17635d;min-height:26px}button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #17635d;outline-offset:3px}#error{background:#fff1d6;padding:16px;border-radius:12px}[hidden]{display:none!important}.note{font-size:12px;color:#577f72}@media(max-width:430px){main{padding-top:max(12px,env(safe-area-inset-top))}.controls{gap:7px}select{font-size:13px;padding:8px}header a{font-size:13px}.turn{gap:6px}.turn button{font-size:12px;padding:8px}}
</style></head><body><main>
<header><div><span class="eyebrow">PLAYSAAL · MYSUPERMARKT</span><h1>Dein Team in 360°</h1></div><a href="../mysupermarkt">Zum Spiel →</a></header>
<p>Drehe die Figur mit dem Finger oder der Maus. Das sind die 3D-Modelle aus dem Spiel.</p>
<section><canvas id="model" aria-label="Drehbare 3D-Figur. Alternativ den Winkelregler und die Ansichtsbuttons verwenden."></canvas><div class="caption">Rundum modelliert · Vorderseite, Seiten und Rücken</div></section>
<p id="error" role="alert" hidden></p>
<div class="controls">
<label>Figur<select id="character"><option value="player">Marktleiterin</option><option value="cashier">Kassierer</option><option value="stocker">Warenverräumerin</option><option value="loader">Lagerarbeiter</option><option value="packer">Online-Packerin</option><option value="customer">Kundin</option><option value="customer3">Kunde mit Brille</option></select></label>
<label>Bewegung<select id="pose"><option value="idle">Stehen</option><option value="walk">Laufen</option><option value="carry">Kartons tragen</option><option value="work">Arbeiten</option><option value="cart">Transportwagen</option></select></label>
<label>Kleidung<select id="theme"><option value="0">Sonnengelb</option><option value="1">Koralle</option><option value="2">Mint</option></select></label>
</div>
<div class="turn"><button id="spin" aria-pressed="true">Drehung an</button><button data-angle="0">Vorne</button><button data-angle="90">Seite</button><button data-angle="180">Hinten</button></div>
<label for="angle">Blickwinkel <output id="angleValue">0°</output></label><input type="range" id="angle" min="0" max="359" value="0">
<p class="note">Diese Ansicht verändert deinen Spielstand nicht.</p>
</main><script src="../../assets/three.min.js"></script><script type="module" src="./figuren.js"></script></body></html>
