<style>
/* ANBISS: Angelkasten-Look. Moosgrün-Schwarz wie nasses Gummi, Creme wie Wachstuch,
   Signalorange wie die Posenspitze. Schrift: Barlow Condensed für alles Technische,
   Big Shoulders Stencil nur für Logo und große Zahlen. Alle Farben fest gesetzt (Spiel hat einen Look). */
:root{
  --ink:#0d1510;
  --panel:rgba(14,22,17,.86);
  --panel-2:rgba(24,36,28,.92);
  --solid:#132019;
  --solid-2:#1b2b21;
  --line:rgba(236,230,208,.15);
  --line-2:rgba(236,230,208,.28);
  --paper:#eee8d3;
  --muted:#a7b19d;
  --moss:#7c9a55;
  --signal:#ff6a1c;
  --signal-2:#ff8a47;
  --signal-ink:#1d0c02;
  --gold:#e8b84a;
  --silver:#c4ccd2;
  --bronze:#c58a55;
  --danger:#ff4a3a;
  --ok:#8fd16a;
  --water:#7fb7c9;
  --f-ui:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-stencil:"Big Shoulders Stencil Display","Barlow Condensed",Impact,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);overflow:hidden;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{display:block;width:100%;height:100%;touch-action:none}
#game .reel,#game .drag button,#game .net{touch-action:none}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

/* ---------- HUD oben ---------- */
.hud{position:absolute;inset:0;pointer-events:none;font-family:var(--f-ui)}
.hud>*{pointer-events:auto}
.top{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 12px);display:flex;align-items:flex-start;gap:8px;padding:0 12px;pointer-events:none!important}
.top>*>*,.top>button{pointer-events:auto}
.ibtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:rgba(23,18,42,.66);border:1px solid rgba(246,242,255,.25);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:0;flex:none}
.ibtn svg{width:16px;height:16px}
.stats{margin-left:46px;display:flex;flex-direction:column;gap:5px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:9px;background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-weight:700;font-size:17px;letter-spacing:.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip svg{width:16px;height:16px;flex:none}
.money{color:var(--paper)}
.money b{color:var(--gold);font-weight:700}
.lvl{height:24px;font-size:14px;padding:0 9px;gap:8px;color:var(--muted)}
.lvl b{color:var(--paper)}
.xpbar{width:58px;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--moss);transition:width .4s ease}
.right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.clock{font-size:17px}
.clock .w{color:var(--muted);font-weight:600}
.spotchip{height:24px;font-size:14px;color:var(--muted);font-weight:600}
.spotchip b{color:var(--paper);font-weight:700}
.sonar{width:150px;border-radius:9px;background:#06100d;border:1px solid var(--line);overflow:hidden;position:relative}
.sonar canvas{display:block;width:150px;height:88px}
.sonar span{position:absolute;left:7px;top:4px;font-size:12px;font-weight:700;letter-spacing:.06em;color:#7fe0b0;text-shadow:0 1px 2px #000}

/* Fisch des Tages / Hinweise */
.toast{position:absolute;left:50%;top:27%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(92vw,420px)}
.toast div{background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-weight:600;font-size:16px;text-align:center;animation:tin .25s ease-out both}
.toast div.good{border-color:rgba(143,209,106,.5)}
.toast div.bad{border-color:rgba(255,74,58,.55)}
.toast div.gold{border-color:rgba(232,184,74,.6);color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.callout{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--f-stencil);font-weight:800;font-size:clamp(46px,13vw,92px);letter-spacing:.02em;color:var(--paper);text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 40px rgba(0,0,0,.5);pointer-events:none;white-space:nowrap;opacity:0}
.callout.show{animation:pop 1.1s ease-out both}
.callout.hot{color:var(--signal)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}25%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-58%)}}
.coach{position:absolute;left:50%;top:calc(var(--safe-t) + 96px);transform:translateX(-50%);width:min(88vw,380px);background:var(--paper);color:var(--ink);border-radius:12px;padding:11px 14px 12px;font-family:var(--f-body);font-size:15px;line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.4);pointer-events:none}
.coach b{font-family:var(--f-ui);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#a24410;display:block;margin-bottom:2px}

/* ---------- Unten: Werkzeugleiste ---------- */
.bottom{position:absolute;left:0;right:0;bottom:0;padding:0 10px calc(var(--safe-b) + 10px);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.bottom>*{pointer-events:auto}
.rig{display:inline-flex;align-items:center;gap:8px;max-width:100%;height:36px;padding:0 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line-2);font-family:var(--f-ui);font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rig svg{width:16px;height:16px;color:var(--signal);flex:none}
.rig .warn{color:var(--signal-2)}
.dock{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(100%,460px);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.dock button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border:0;border-radius:11px;background:transparent;font-family:var(--f-ui);font-weight:600;font-size:13px;letter-spacing:.03em;color:var(--muted)}
.dock button svg{width:23px;height:23px;color:var(--paper)}
.dock button:active{background:rgba(255,255,255,.07)}
.dock .dot{position:absolute;top:5px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 2px var(--solid)}
.actions{display:flex;gap:10px;justify-content:center;width:min(100%,460px);pointer-events:none!important}
.actions>*{pointer-events:auto}
.abtn{height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);font-family:var(--f-ui);font-weight:700;font-size:17px;letter-spacing:.04em;display:inline-flex;align-items:center;gap:8px}
.abtn svg{width:18px;height:18px}
.abtn.hot{background:var(--signal);color:var(--signal-ink);border-color:transparent}
.abtn small{font-weight:600;opacity:.75}

/* ---------- Drill ---------- */
.fight{position:absolute;left:0;right:0;bottom:0;height:260px;pointer-events:none}
.fight>*{pointer-events:auto}
.gauge{position:absolute;left:50%;bottom:calc(var(--safe-b) + 124px);transform:translateX(-50%);width:210px;pointer-events:none;text-align:center}
.gauge svg{display:block;width:210px;height:112px;overflow:visible}
.gauge .read{margin-top:-20px;font-family:var(--f-ui);font-weight:700;font-size:15px;letter-spacing:.03em;color:var(--muted);font-variant-numeric:tabular-nums}
.gauge .read b{font-family:var(--f-stencil);font-size:30px;color:var(--paper);letter-spacing:.02em;display:block;line-height:1}
.drag{position:absolute;left:14px;bottom:calc(var(--safe-b) + 18px);display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;padding:8px 0;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.drag button{width:52px;height:42px;border-radius:10px;border:1px solid var(--line-2);background:var(--solid-2);font-family:var(--f-ui);font-size:26px;font-weight:700;line-height:1}
.drag span{font-family:var(--f-ui);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.drag b{font-family:var(--f-ui);font-size:19px;font-variant-numeric:tabular-nums}
.reel{position:absolute;right:14px;bottom:calc(var(--safe-b) + 18px);width:118px;height:118px;border-radius:50%;border:2px solid rgba(255,255,255,.22);background:radial-gradient(circle at 50% 40%,#2b4033,#14211a 70%);display:grid;place-items:center;font-family:var(--f-ui);font-weight:800;font-size:17px;letter-spacing:.08em;touch-action:none}
.reel svg{width:40px;height:40px;margin-bottom:-6px;color:var(--signal)}
.reel span{display:flex;flex-direction:column;align-items:center;gap:2px}
.reel small{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.reel.on{background:radial-gradient(circle at 50% 40%,#ff8a47,#d4510f 75%);color:var(--signal-ink);border-color:transparent}
.reel.on svg{color:var(--signal-ink);animation:spin .5s linear infinite}
.reel.on small{color:rgba(29,12,2,.7)}
@keyframes spin{to{transform:rotate(360deg)}}
.side{position:absolute;right:140px;bottom:calc(var(--safe-b) + 58px);font-family:var(--f-ui);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--muted);pointer-events:none;text-align:right}
.net{position:absolute;left:50%;bottom:calc(var(--safe-b) + 46px);transform:translateX(-50%);height:58px;padding:0 26px;border-radius:999px;border:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-weight:800;font-size:21px;letter-spacing:.06em;box-shadow:0 0 0 6px rgba(238,232,211,.22);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(238,232,211,.08)}}

/* ---------- Posenblick (Ausschnitt-Kamera) ---------- */
.inset{position:absolute;right:12px;bottom:calc(var(--safe-b) + 188px);width:124px;height:124px;border-radius:8px;border:3px solid var(--paper);box-shadow:0 6px 18px rgba(0,0,0,.45);pointer-events:none}
.inset span{position:absolute;left:6px;top:4px;font-family:var(--f-ui);font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper);text-shadow:0 1px 3px #000}
.inset.alert{border-color:var(--signal);box-shadow:0 0 0 4px rgba(255,106,28,.35),0 6px 18px rgba(0,0,0,.45)}
#fade{position:absolute;inset:0;background:#050806;opacity:0;pointer-events:none;transition:opacity .45s ease;z-index:35}
#fade.on{opacity:1}

/* ---------- Wurf ---------- */
.power{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:16px;height:min(42vh,300px);border-radius:9px;background:rgba(10,16,12,.6);border:1px solid var(--line-2);overflow:hidden;pointer-events:none}
.power i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,var(--moss),var(--gold) 70%,var(--signal))}
.power b{position:absolute;left:-2px;right:-2px;height:2px;background:var(--paper)}
.powerlbl{position:absolute;right:42px;top:50%;transform:translateY(-50%);font-family:var(--f-stencil);font-size:30px;font-weight:800;color:var(--paper);text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none;text-align:right;line-height:1}
.powerlbl small{display:block;font-family:var(--f-ui);font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.04em}

/* ---------- Bögen (Panels) ---------- */
.sheet{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,9,7,.45);pointer-events:auto;z-index:20}
.card{width:min(100%,560px);max-height:min(86vh,760px);display:flex;flex-direction:column;background:var(--solid);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.45);animation:up .22s ease-out both}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.card header{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.card h2{margin:0;font-family:var(--f-ui);font-weight:800;font-size:26px;letter-spacing:.02em;line-height:1}
.card header .sub{font-family:var(--f-ui);font-weight:600;color:var(--muted);font-size:15px}
.card header .x{margin-left:auto;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--solid-2);display:grid;place-items:center}
.card header .x svg{width:16px;height:16px}
.tabs{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:transparent;font-family:var(--f-ui);font-weight:700;font-size:15px;letter-spacing:.03em;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--paper);color:var(--ink);border-color:transparent}
.body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(var(--safe-b) + 18px);touch-action:pan-y;overscroll-behavior:contain}
.sec{font-family:var(--f-ui);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.sec:first-child{margin-top:4px}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:11px 12px;border-radius:12px;background:var(--solid-2);border:1px solid var(--line)}
.item.sel{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal)}
.item.locked{opacity:.55}
.item .t{font-family:var(--f-ui);font-weight:700;font-size:18px;line-height:1.1}
.item .d{grid-column:1;font-size:14px;color:var(--muted);line-height:1.35}
.item .stat{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--f-ui);font-size:14px;font-weight:600;color:var(--paper);grid-column:1}
.item .stat span{color:var(--muted);font-weight:500}
.item .side-r{grid-row:1/span 3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--solid);font-family:var(--f-ui);font-weight:700;font-size:16px;letter-spacing:.03em;white-space:nowrap}
.btn.hot{background:var(--signal);border-color:transparent;color:var(--signal-ink)}
.btn.ok{background:var(--paper);border-color:transparent;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.tag{display:inline-block;font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:rgba(255,255,255,.08);color:var(--muted)}
.tag.on{background:rgba(143,209,106,.16);color:var(--ok)}
.tag.warn{background:rgba(255,106,28,.16);color:var(--signal-2)}
.price{font-family:var(--f-ui);font-weight:700;font-size:16px;color:var(--gold);white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.slider{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--solid-2);border:1px solid var(--line)}
.slider input{width:100%;accent-color:var(--signal)}
.slider b{font-family:var(--f-ui);font-size:20px;min-width:62px;text-align:right}
.slider label{font-family:var(--f-ui);font-weight:700;font-size:16px}
.note{font-size:14px;line-height:1.4;color:var(--muted);padding:10px 12px;border-radius:10px;border:1px dashed var(--line-2);margin-top:8px}
.note b{color:var(--paper)}
.empty{color:var(--muted);font-size:15px;padding:8px 2px}

/* Fangbuch */
.book{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fish{position:relative;padding:10px 10px 11px;border-radius:12px;background:var(--solid-2);border:1px solid var(--line);min-width:0}
.fish svg{display:block;width:100%;height:46px}
.fish .n{font-family:var(--f-ui);font-weight:700;font-size:17px;line-height:1.1;margin-top:4px}
.fish .l{font-size:12px;color:var(--muted);font-style:italic}
.fish .r{font-family:var(--f-ui);font-size:14px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}
.fish .r span{color:var(--muted);font-weight:500}
.fish.unk .n{color:var(--muted)}
.fish .medal{position:absolute;right:9px;top:9px;width:14px;height:14px;border-radius:50%}
.medal.b{background:var(--bronze)}.medal.s{background:var(--silver)}.medal.g{background:var(--gold);box-shadow:0 0 10px rgba(232,184,74,.6)}
.fish .tip{font-size:12.5px;color:var(--muted);line-height:1.3;margin-top:4px}
.prog{height:8px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--moss)}
.quest .t{font-size:17px}

/* Karte */
.map{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#2b3a26}
.map canvas{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-50%);min-width:30px;height:30px;padding:0 8px;border-radius:15px;border:2px solid var(--paper);background:var(--solid);font-family:var(--f-ui);font-weight:800;font-size:14px;display:grid;place-items:center;white-space:nowrap}
.pin.here{background:var(--signal);color:var(--signal-ink);border-color:var(--signal-ink)}
.pin.lock{opacity:.6;border-style:dashed}

/* Fangkarte */
.catch{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;z-index:25;pointer-events:auto;background:linear-gradient(to bottom,rgba(5,9,7,0) 30%,rgba(5,9,7,.55) 62%)}
.catch .cc{width:min(100%,520px);padding:16px 16px calc(var(--safe-b) + 16px);background:var(--solid);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;animation:up .25s ease-out both}
.catch .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.catch .badges span{font-family:var(--f-ui);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--signal);color:var(--signal-ink)}
.catch .badges span.g{background:var(--gold);color:#241a02}
.catch .badges span.s{background:var(--silver);color:#1a1f22}
.catch .badges span.b{background:var(--bronze);color:#1f1206}
.catch .badges span.m{background:rgba(255,255,255,.1);color:var(--paper)}
.catch h2{margin:0;font-family:var(--f-ui);font-weight:800;font-size:32px;line-height:1}
.catch .lat{font-style:italic;color:var(--muted);font-size:14px}
.catch .big{display:flex;gap:18px;align-items:baseline;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.catch .big b{font-family:var(--f-stencil);font-weight:800;font-size:48px;line-height:1}
.catch .big span{font-family:var(--f-ui);font-weight:700;font-size:22px;color:var(--muted)}

  if (e.code === 'Escape' || e.code === 'KeyP') { if (PANEL) closePanel(); else if (G.state !== 'title') pause($('pause').hidden); return; }
  if (PANEL || !$('pause').hidden) return;
  if (G.state === 'title' && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); startGame(); return; }
  if (e.code === 'Space') {
    e.preventDefault();
    if (G.state === 'idle') { G.aimStartYaw = G.aimYaw; startCast(); }
    else if (G.state === 'wait' || (G.state === 'bite' && G.tech !== 'spin')) strike();
    else if (G.state === 'bite' && G.tech === 'spin') { strike(); G.reelHeld = true; }
    else if (G.state === 'spin' || G.state === 'fight') { G.reelHeld = true; reelBtn.classList.add('on'); }
    else if (G.state === 'catch') finishCatch(!(G.catchData && G.catchData.under));
  }
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') { if (G.state === 'aim') G.aimKey = 1; G.sideKey = -1; }
  if (e.code === 'KeyD' || e.code === 'ArrowRight') { if (G.state === 'aim') G.aimKey = -1; G.sideKey = 1; }
  if (e.code === 'KeyW' || e.code === 'ArrowUp') setDrag(.05);
  if (e.code === 'KeyS' || e.code === 'ArrowDown') setDrag(-.05);
  if (e.code === 'KeyE' || e.code === 'Enter') { if (G.state === 'fight') tryNet(); else if (G.state === 'snag') freeSnag(); }
  if (e.code === 'KeyR' && (G.state === 'wait' || G.state === 'spin')) retrieve();
  if (e.code === 'KeyF' && (G.state === 'idle' || G.state === 'wait')) feedAction();
  const pk = { KeyG: 'gear', KeyM: 'map', KeyL: 'shop', KeyB: 'book', KeyQ: 'quests' }[e.code]; if (pk && G.state !== 'fight') openPanel(pk);
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'Space') { if (G.state === 'aim') releaseCast(); G.reelHeld = false; reelBtn.classList.remove('on'); }
  if (['KeyA', 'KeyD', 'ArrowLeft', 'ArrowRight'].includes(e.code)) { G.sideKey = 0; G.aimKey = 0; }
});
setInterval(() => { if (G.state === 'aim' && G.aimKey) G.aimYaw = clamp(G.aimYaw + G.aimKey * .025, -.95, .95); }, 16);
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(true); if (G.state !== 'title' && $('pause').hidden) pause(true); } });
window.addEventListener('pagehide', () => save(true));

// Pause und Einstellungen
function pause(on) {
  $('pause').hidden = !on;
  if (on) { G.reelHeld = false; reelBtn.classList.remove('on'); $('optSoundV').textContent = S.settings.sound ? 'an' : 'aus'; $('optQualityV').textContent = S.settings.q === 'auto' ? 'Auto (' + QUAL.level + ')' : S.settings.q; }
}
$('optResume').onclick = () => pause(false);
$('optSound').onclick = () => { S.settings.sound = S.settings.sound ? 0 : 1; AU.setOn(!!S.settings.sound); save(); pause(true); };
$('optQuality').onclick = () => { const order = ['auto', 'hoch', 'mittel', 'niedrig']; S.settings.q = order[(order.indexOf(S.settings.q) + 1) % order.length]; applyQuality(S.settings.q === 'auto' ? (IS_MOBILE ? 'mittel' : 'hoch') : S.settings.q); save(); pause(true); };
$('optTut').onclick = () => { S.tut = 0; save(); pause(false); if (G.state === 'idle') coach('cast'); };
$('optReset').onclick = () => { if (confirm('Spielstand wirklich löschen? Geld, Ausrüstung und Fangbuch sind dann weg.')) { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* egal */ } running = false; location.reload(); } };

// Reisen und Warten
function fade(fn) { G.state = 'travel'; $('fade').classList.add('on'); setTimeout(() => { fn(); setTimeout(() => { $('fade').classList.remove('on'); G.state = 'idle'; setActions(idleActions()); updateRig(); }, 120); }, 480); }
function travel(id) {
  if (G.state !== 'idle' && G.state !== 'wait' && G.state !== 'spin' && G.state !== 'snag') return;
  retrieveDone();
  fade(() => { placeAtSpot(id); S.time += 15; stepWeather(15); save(); toast(SPOTS[id].name + '. ' + SPOTS[id].desc); });
}
function skipTo(hr) {
  retrieveDone();
  fade(() => { const now = hourNow(); let dh = hr - now; if (dh <= .05) dh += 24; const mins = dh * 60; S.time += mins; while (S.time >= 1440) { S.time -= 1440; S.day++; } for (let m = 0; m < mins; m += 10) stepWeather(10); G.feed.lvl = 0; save(); toast('Es ist ' + pad2(Math.floor(hr % 24)) + ':' + pad2(Math.round((hr % 1) * 60)) + ' Uhr. ' + WX_NAMES[ENV.wx] + '.'); });
}

// =====================================================================
// START
// =====================================================================
function dailyBonus() {
  const today = todayKey(); if (S.daily.last === today) return;
  const y = new Date(Date.now() - 864e5), yk = y.getFullYear() + '-' + pad2(y.getMonth() + 1) + '-' + pad2(y.getDate());
  const first = !S.daily.last;
  S.daily.streak = S.daily.last === yk ? S.daily.streak + 1 : 1; S.daily.last = today;
  if (first) return;
  const gift = Math.round((3 + Math.min(7, S.daily.streak) * 1.5) * 100) / 100;
  S.money += gift; S.baits.made = (S.baits.made || 0) + 10;
  setTimeout(() => toast('Willkommen zurück! Tagesbonus: ' + fmtEur(gift) + ' und 10 Maden' + (S.daily.streak > 1 ? ' · ' + S.daily.streak + ' Tage in Folge' : '') + '.', 'gold'), 700);
}
function startGame() {
  AU.init(); AU.setOn(!!S.settings.sound);
  $('title').hidden = true; $('hud').hidden = false;
  G.state = 'idle'; dailyBonus(); ensureQuests(); updateHud(); updateRig(); updateDots(); setActions(idleActions());
  const fod = SPECIES[fishOfDay()];
  setTimeout(() => toast('Fisch des Tages: ' + fod.name + ' (doppelter Preis)'), 1500);
  if (S.tut === 0) setTimeout(() => coach('cast'), 600);
  if (S.own.gadgets.echolot) $('sonar').hidden = false;
  save(true);
}
function boot() {
  const had = loadSave();
  rod.length = rodDef().len || 3.9;
  fixBait();
  ENV.wx = S.time < 8 * 60 ? 1 : 0; ENV.windTarget = ENV.wind = .2; nextWeather(); if (!had) { ENV.wx = 1; ENV.cloud = .38; }
  placeAtSpot(S.unlocked[S.spot] ? S.spot : 'steg');
  applyQuality(S.settings.q === 'auto' ? (IS_MOBILE ? 'mittel' : 'hoch') : S.settings.q);
  updateEnvironment(0, 0);
  if (had && S.stats.caught) { $('saveStat').hidden = false; $('saveStat').innerHTML = 'Stufe ' + S.lvl + ' <span>·</span> ' + BOOK_ORDER.filter(k => S.book[k]).length + ' Arten <span>·</span> ' + fmtEur(S.money); $('btnStart').textContent = 'Weiterangeln'; }
  $('btnStart').addEventListener('click', startGame);
  if (IS_MOBILE) $('keysHelp').hidden = true;
  $('title').hidden = false; $('loading').hidden = true;
  requestAnimationFrame(t => { lastT = t; frame(t); });
  // Testzugang für automatisierte Prüfungen
  window.__anbiss = {
    G, S, ENV, SPECIES, SPOTS, get state() { return G.state; },
    start: startGame,
    step(sec, fn) { const n = Math.round(sec * 30); for (let i = 0; i < n; i++) { if (fn) fn(i); tick(1 / 30); } },
    castTo(power, yaw) { G.aimYaw = yaw || 0; startCast(); G.holdT = 0; G.power = power; G.state = 'aim'; releaseCast(); },
    forceBite(id) { const f = rollFish(id, baitCtx()); G.bite = makeBite(f); G.state = 'bite'; return G.bite; },
    strike, tryNet, finishCatch, setTime(h) { S.time = h * 60; }, travel: id => { S.unlocked[id] = 1; placeAtSpot(id); },
    breakdown() { const out = []; scene.traverse(o => { if (!o.isMesh || !o.visible) return; const g = o.geometry; const t = (g.index ? g.index.count : g.attributes.position.count) / 3; const n = o.isInstancedMesh ? o.count : 1; out.push([o.name || o.material.type + (o.material.userData && o.material.userData.ck ? o.material.userData.ck : ''), Math.round(t), n, Math.round(t * n)]); }); return out.sort((a, b) => b[3] - a[3]).slice(0, 12); },
    render, info: () => ({ tris: renderer.info.render.triangles, calls: renderer.info.render.calls, q: QUAL.level }), lambda: () => computeLambda(baitCtx()), quality: applyQuality, openPanel, closePanel, pause,
    _: { rollFish, hookFish, baitCtx, makeBite, computeLambda, evaluateCatch, fightStep, tick, placeAtSpot, retrieveDone, lineDef, rodDef, reelDef, dragKg, actAt },
  };
}
boot();
})();
