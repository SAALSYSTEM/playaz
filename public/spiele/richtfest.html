<title>Richtfest</title>
<link rel="stylesheet" href="../assets/fonts.css">
<style>
/* Layout: a crane-yellow handheld centered on a dark site-at-night backdrop; 160×144 pixel screen on top, D-pad and A/B below. One committed visual world with a four-shade "Kran-Gelb" palette, so every color is explicit. */
:root{
  --bg:#17130c;
  --shell:#E7B32A;
  --shell-edge:#B48714;
  --bezel:#3A3326;
  --btn:#2B2418;
  --abtn:#9A3F24;
  --ink:#231A0B;
  --muted:#a99d7f;
  --c0:#F3E9C6; --c1:#D4B04A; --c2:#7A6328; --c3:#231A0B;
  --font-pixel:"Pixelify Sans","Courier New",monospace;
  --font-display:"Bungee","Arial Black",sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;min-height:100%;background:var(--bg);color:#e9dfc4;font-family:var(--font-pixel);display:flex;justify-content:center;align-items:flex-start;padding-inline:16px;padding-block:16px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}

.device{--sw:max(220px,min(calc(100vw - 100px),400px,calc((100vh - 340px) * 10 / 9)));display:flex;flex-direction:column;gap:14px;padding:18px 18px 22px;background:var(--shell);border-radius:14px 14px 56px 14px;box-shadow:inset 0 -5px 0 var(--shell-edge),inset 0 2px 0 rgba(255,255,255,.25),0 18px 40px rgba(0,0,0,.45);max-width:100%}
.bezel{display:flex;flex-direction:column;gap:6px;padding:10px 14px 8px;background:var(--bezel);border-radius:8px 8px 26px 8px}
.bezel-top{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.led{width:7px;height:7px;border-radius:50%;background:#e2533a;box-shadow:0 0 6px #e2533a}
.brand{display:flex;align-items:baseline;gap:8px;padding-inline:4px;color:var(--ink)}
.brand b{font-family:var(--font-display);font-weight:400;font-size:20px;letter-spacing:.02em}
.brand span{font-size:13px;font-weight:600}

.controls{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px 12px}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}
.dpad button,.dpad .mid{background:var(--btn);border:0;padding:0;color:#bfb293;display:grid;place-items:center;cursor:pointer;touch-action:none}
.dpad .up{grid-column:2;grid-row:1;border-radius:6px 6px 0 0}
.dpad .left{grid-column:1;grid-row:2;border-radius:6px 0 0 6px}
.dpad .mid{grid-column:2;grid-row:2}
.dpad .right{grid-column:3;grid-row:2;border-radius:0 6px 6px 0}
.dpad .down{grid-column:2;grid-row:3;border-radius:0 0 6px 6px}
.dpad button.down-state,.ab button.down-state,.sys button.down-state{filter:brightness(1.35)}
.ab{grid-column:3;display:flex;align-items:flex-end;gap:12px;padding-bottom:4px}
.ab button{width:56px;height:56px;border-radius:50%;border:0;background:var(--abtn);color:var(--c0);font-family:var(--font-display);font-size:17px;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),0 2px 0 rgba(0,0,0,.25);touch-action:none}
.ab .a{margin-bottom:24px}
.sys{grid-column:1 / -1;display:flex;justify-content:center;gap:18px}
.sys button{min-height:44px;min-width:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;cursor:pointer;color:var(--ink);font-family:var(--font-pixel);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;touch-action:none}
.sys .pill{display:block;width:44px;height:11px;border-radius:6px;background:var(--btn);transform:rotate(-18deg)}
.sys button:focus-visible,.ab button:focus-visible,.dpad button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.keys{margin:0;font-size:13px;line-height:1.4;color:var(--muted);text-align:center;max-width:46ch}

/* ---------- screen ---------- */
.screen{position:relative;width:var(--sw);aspect-ratio:10/9;background:var(--c0);overflow:hidden;--u:2px;color:var(--c3);font-family:var(--font-pixel)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.title{position:absolute;left:0;right:0;top:calc(var(--u)*10);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2);z-index:1;pointer-events:none}
.title .t1{font-family:var(--font-display);font-size:calc(var(--u)*17);line-height:1;color:var(--c3);text-shadow:var(--u) var(--u) 0 var(--c1)}
.title .t2{font-size:calc(var(--u)*7);color:var(--c2)}

.box{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*40);background:var(--c0);border:calc(var(--u)*2) solid var(--c3);box-shadow:inset 0 0 0 var(--u) var(--c1);padding:calc(var(--u)*4) calc(var(--u)*7);font-size:calc(var(--u)*7);line-height:1.3;overflow:hidden;z-index:2;cursor:pointer}
.box.narrow{right:calc(var(--u)*78)}
.box p{margin:0}
.more{position:absolute;right:calc(var(--u)*5);bottom:calc(var(--u)*3);width:0;height:0;border-left:calc(var(--u)*3) solid transparent;border-right:calc(var(--u)*3) solid transparent;border-top:calc(var(--u)*4) solid var(--c3);animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(var(--u))}}

.menu{position:absolute;background:var(--c0);border:calc(var(--u)*2) solid var(--c3);box-shadow:inset 0 0 0 var(--u) var(--c1);padding:calc(var(--u)*4) calc(var(--u)*5);font-size:calc(var(--u)*7);line-height:1.2;display:flex;flex-direction:column;gap:calc(var(--u)*3);z-index:3}
.menu.side{top:0;right:0;width:calc(var(--u)*76)}
.menu.battle{right:0;bottom:0;width:calc(var(--u)*80);height:calc(var(--u)*40);justify-content:center}
.menu.moves{left:0;right:0;bottom:0;height:calc(var(--u)*40);justify-content:center}
.menu.bottom{left:0;right:0;bottom:0;height:calc(var(--u)*44);justify-content:center}
.menu.full{inset:0;overflow:auto}
.menu.title{right:calc(var(--u)*4);bottom:calc(var(--u)*4);width:calc(var(--u)*84)}
.menu-head{font-size:calc(var(--u)*7);line-height:1.3}
.menu-list{display:grid;gap:calc(var(--u)*2) calc(var(--u)*6)}
.menu-info{font-size:calc(var(--u)*6);line-height:1.3;color:var(--c2);border-top:var(--u) solid var(--c1);padding-top:calc(var(--u)*2)}
.menu-info b{color:var(--c3);font-weight:600}
.opt{display:flex;align-items:center;gap:calc(var(--u)*3);font:inherit;color:inherit;background:none;border:0;padding:var(--u) 0;text-align:left;cursor:pointer;min-width:0}
.opt::before{content:"";flex:none;border-left:calc(var(--u)*3) solid var(--c3);border-top:calc(var(--u)*2.5) solid transparent;border-bottom:calc(var(--u)*2.5) solid transparent;visibility:hidden}
.opt.sel::before{visibility:visible}
.menu.full .menu-list{gap:calc(var(--u)*2)}
.menu.full .opt{border-bottom:var(--u) solid var(--c1);padding-bottom:calc(var(--u)*2)}

.tm{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--u) calc(var(--u)*4);align-items:center}
.tm-b{display:block;height:calc(var(--u)*4);border:var(--u) solid var(--c3)}
.tm-b i{display:block;height:100%;background:var(--c2)}
.tm-l,.tm-h{font-size:calc(var(--u)*6);text-align:right}

.hud{position:absolute;font-size:calc(var(--u)*7);line-height:1.1;z-index:1}
.hud.foe{left:calc(var(--u)*4);top:calc(var(--u)*5);width:calc(var(--u)*80);border-left:var(--u) solid var(--c3);border-bottom:var(--u) solid var(--c3);padding:0 0 calc(var(--u)*2) calc(var(--u)*3)}
.hud.me{right:calc(var(--u)*4);top:calc(var(--u)*64);width:calc(var(--u)*78);border-right:var(--u) solid var(--c3);border-bottom:var(--u) solid var(--c3);padding:0 calc(var(--u)*3) calc(var(--u)*2) 0}
.hud-top{display:flex;justify-content:space-between;gap:calc(var(--u)*3)}
.hp{display:flex;align-items:center;gap:calc(var(--u)*2);margin-top:calc(var(--u)*2)}
.hp-label{font-size:calc(var(--u)*5);font-weight:600}
.bar{flex:1;height:calc(var(--u)*4);border:var(--u) solid var(--c3);background:var(--c0)}
.bar .fill{display:block;height:100%;width:100%;background:var(--c2);transition:width .45s steps(10)}
.bar .fill.low{background:var(--c3)}
.hp-num{text-align:right;margin-top:var(--u);font-size:calc(var(--u)*6)}
.xp{height:calc(var(--u)*2);background:var(--c1);margin-top:var(--u)}
.xp .fill{display:block;height:100%;width:0;background:var(--c3);transition:width .4s steps(8)}

.info{display:flex;gap:calc(var(--u)*5);align-items:center;font-size:calc(var(--u)*7);line-height:1.3}
.info-img,.cat img{image-rendering:pixelated;flex:none}
.info-img{width:calc(var(--u)*32);height:calc(var(--u)*32)}
.info-dex{margin:0;font-size:calc(var(--u)*6);line-height:1.3;color:var(--c2)}
.info-stats,.info-moves{font-size:calc(var(--u)*6);line-height:1.3}
.cat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*3);margin-top:calc(var(--u)*3)}
.cat{display:flex;flex-direction:column;align-items:center;gap:var(--u);font-size:calc(var(--u)*6);text-align:center;padding:var(--u);border:var(--u) solid var(--c1);min-width:0}
.cat img{width:calc(var(--u)*20);height:calc(var(--u)*20)}
.cat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.orden-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*3);margin-top:calc(var(--u)*3)}

.cat small{font-size:calc(var(--u)*5);color:var(--c2)}

.end p{margin:0;font-size:calc(var(--u)*6);line-height:1.3;color:var(--c2)}

.flash{position:absolute;inset:0;background:var(--c3);opacity:0;pointer-events:none;z-index:5}
.flash.go{animation:flash .6s steps(1,end) forwards}
@keyframes flash{0%{opacity:1}16%{opacity:0}33%{opacity:1}50%{opacity:0}66%{opacity:1}83%,100%{opacity:0}}

@media (max-width:480px){
  .device{--sw:max(220px,min(calc(100vw - 72px),400px,calc((100vh - 320px) * 10 / 9)));padding:10px 10px 18px;border-radius:12px 12px 40px 12px}
  .bezel{padding:8px 8px 6px;border-radius:6px 6px 20px 6px}
}
@media (prefers-reduced-motion:reduce){
  .more{animation:none}
  .flash.go{animation:none}
  .bar .fill,.xp .fill{transition:none}
}
</style>

  // ================= BATTLE =================
  const B = { foe: null, me: null, foes: [], fi: 0, trainer: null, st: null, result: null, foeVis: false, meVis: false, foeOff: 0, meOff: 0, foeDx: 0, meDx: 0, foeDy: 0, meDy: 0, hook: null };
  function label(who) { const m = who === "me" ? B.me : B.foe; return who === "foe" && B.trainer ? `${B.trainer.short} ${name(m)}` : name(m); }
  function setBar(el, f) { f = clamp(f, 0, 1); el.style.width = (f * 100) + "%"; el.classList.toggle("low", f <= 0.25); }

      $("meXp").style.width = (clamp((B.me.xp - a) / (b - a), 0, 1) * 100) + "%";

  }
  function showHud(which, on) { $(which === "foe" ? "hudFoe" : "hudMe").hidden = !on; }
  async function lunge(who) { const k = who + "Dx", d = who === "me" ? 8 : -8; await tween(B, k, d, reduced ? 1 : 90); await tween(B, k, 0, reduced ? 1 : 120); }
  async function blink(who) { const k = who + "Vis"; for (let i = 0; i < 3; i++) { B[k] = false; await sleep(70); B[k] = true; await sleep(70); } }
  async function faintAnim(who) { snd.hit(); await tween(B, who + "Dy", 14, reduced ? 1 : 240); B[who + "Vis"] = false; B[who + "Dy"] = 0; }

  async function battle(foes, trainer) {

    else await say(`${ein(B.foe)} kriecht aus dem Schutt!`);

  async function sendMe(m) {
    B.me = m; B.st.me = { atk: 0, def: 0 }; B.meVis = true; B.meOff = -90; B.meDy = 0;
    updateHuds(); showHud("me", true);

  async function chooseAction() {
    while (true) {
      setBox(`Was soll ${name(B.me)} tun?`, true);
      const i = await choose(["Kampf", "Team", "Tasche", "Flucht"], { variant: "battle", cols: 2 });
      if (i === 0) {
        const mv = B.me.moves;
        const k = await choose(mv.map((id) => MOVES[id].name), {
          variant: "moves", cols: 2, cancel: true,
          info: (j) => { const M = MOVES[mv[j]]; return `<b>${TYPE_NAME[M.type]}</b> · ${M.pow ? "Stärke " + M.pow : M.desc}`; }
        });
        if (k >= 0) return { kind: "move", id: mv[k] };
      } else if (i === 1) {
        hideBox();
        const t = await teamMenu(true, false);
        if (t >= 0) return { kind: "switch", idx: t };
      } else if (i === 2) {

  }
  function pickFoeMove() {
    const f = B.foe, list = f.moves;
    if (B.trainer && Math.random() < 0.7) {
      let best = list[0], bs = -1;
      for (const id of list) {
        const M = MOVES[id];
        const sc = M.pow ? M.pow * eff(M.type, SPECIES[B.me.sp].type) * (M.type === SPECIES[f.sp].type ? 1.5 : 1) * M.acc / 100 : 20;
        if (sc > bs) { bs = sc; best = id; }
      }
      return best;
    }
    return list[Math.floor(Math.random() * list.length)];
  }
  async function turn(act) {
    hideBox();
    const foeMove = pickFoeMove();
    if (act.kind === "move") {
      const ms = stats(B.me).spd, fs = stats(B.foe).spd;
      const meFirst = ms > fs || (ms === fs && Math.random() < 0.5);
      for (const who of meFirst ? ["me", "foe"] : ["foe", "me"]) {
        await doMove(who, who === "me" ? act.id : foeMove);
        const r = await afterHit();
        if (r === "end") return B.result;
        if (r === "faint") return null;
      }
      return null;
    }
    if (act.kind === "run") {
      if (B.trainer) { await say("Aus einem Duell läuft man nicht weg!"); return null; }
      const p = clamp(0.5 + (stats(B.me).spd - stats(B.foe).spd) * 0.04, 0.3, 0.95);
      if (Math.random() < p) { await say("Du bist entkommen!"); return "run"; }
      await say("Flucht gescheitert!");
    } else if (act.kind === "switch") {
      await say(`${name(B.me)}, komm zurück!`);
      B.meVis = false;
      await sendMe(G.team[act.idx]);
    } else if (act.kind === "food") {
      G.items.brotzeit--;
      const mx = stats(B.me).maxhp, h = Math.min(20, mx - B.me.hp);
      B.me.hp += h; snd.heal(); updateHuds();
      await say(`${name(B.me)} isst die Brotzeit. +${h} LP.`);
    } else if (act.kind === "hook") {
      const r = await throwHook();
      if (r) return r;
    }
    await doMove("foe", foeMove);
    const r = await afterHit();
    return r === "end" ? B.result : null;
  }
  async function doMove(who, id) {
    const oth = who === "me" ? "foe" : "me";
    const att = who === "me" ? B.me : B.foe, def = who === "me" ? B.foe : B.me;
    const mv = MOVES[id];
    await say(`${label(who)} setzt ${mv.name} ein!`);
    await lunge(who);
    if (Math.random() * 100 >= mv.acc) { await say("Daneben!"); return; }
    if (!mv.pow) {
      const e = mv.effect, tw = e.target === "self" ? who : oth, st = B.st[tw], before = st[e.stat];
      st[e.stat] = clamp(before + e.delta, -6, 6);
      const statName = e.stat === "atk" ? "Der Angriff" : "Die Verteidigung";
      if (st[e.stat] === before) await say(`Bei ${label(tw)} tut sich nichts mehr.`);
      else { snd.move(); await say(`${statName} von ${label(tw)} ${e.delta > 0 ? "steigt" : "sinkt"}!`); }
      return;
    }
    const sa = stats(att), sd = stats(def);
    const A = sa.atk * stageMul(B.st[who].atk), D = sd.def * stageMul(B.st[oth].def);
    let dmg = Math.floor(Math.floor((2 * att.lvl / 5 + 2) * mv.pow * A / D) / 50) + 2;
    const stab = mv.type === SPECIES[att.sp].type ? 1.5 : 1;
    const e = eff(mv.type, SPECIES[def.sp].type);
    const crit = Math.random() < 1 / 16;
    dmg = Math.max(1, Math.floor(dmg * stab * e * (crit ? 1.5 : 1) * (0.85 + Math.random() * 0.15)));
    if (e > 1) snd.big(); else snd.hit();
    await blink(oth);
    def.hp = Math.max(0, def.hp - dmg);
    updateHuds();
    await sleep(reduced ? 60 : 480);
    if (crit) await say("Volltreffer!");
    if (e > 1) await say("Das sitzt bombenfest!");
    else if (e < 1) await say("Das prallt fast ab …");
  }
  async function gainXp(m, n) {
    m.xp += n;
    updateHuds(); await sleep(reduced ? 40 : 420);
    while (m.lvl < 50 && m.xp >= Math.pow(m.lvl + 1, 3)) {
      const before = stats(m).maxhp;
      m.lvl++;
      m.hp += stats(m).maxhp - before;
      updateHuds(); snd.level();
      await say(`${name(m)} erreicht Level ${m.lvl}!`);
      for (const [lv, id] of SPECIES[m.sp].learn) {
        if (lv !== m.lvl || m.moves.includes(id)) continue;
        if (m.moves.length < 4) { m.moves.push(id); await say(`${name(m)} lernt ${MOVES[id].name}!`); }
        else { const old = m.moves.shift(); m.moves.push(id); await say(`${name(m)} vergisst ${MOVES[old].name} und lernt ${MOVES[id].name}!`); }
      }
    }
    updateHuds();
  }
  async function afterHit() {
    if (B.foe.hp <= 0) {

      await say(`${name(B.me)} bekommt ${gain} Erfahrung.`);

      const rest = G.team.filter((m) => m !== B.me && m.hp > 0 && m.lvl < 50), half = Math.max(1, Math.floor(gain / 2));
      if (rest.length) {
        await say(`Der Rest vom Team schaut zu und bekommt je ${half} Erfahrung.`);
        for (const m of rest) await gainXp(m, half);
      }
      if (B.trainer && B.fi < B.foes.length - 1) {
        B.fi++; B.foe = B.foes[B.fi]; B.st.foe = { atk: 0, def: 0 }; markSeen(B.foe.sp);
        B.foeVis = true; B.foeOff = 90; B.foeDy = 0; updateHuds();

  async function throwHook() {

  async function wildBattle(z) {
    const W = WILD[z] || WILD.sued;
    let sp = pickW(W.list);
    if (Math.random() < W.rare) { const others = STARTERS.filter((s) => s !== G.starter); sp = others[Math.floor(Math.random() * others.length)]; }
    await battle([mk(sp, rnd(W.lv[0], W.lv[1]))], null);
  }
  async function trainerScript(t, x, y) {
    const T = TRAINERS[t];
    if (G.flags[T.flag]) return;
    P.dir = y < P.y ? "up" : y > P.y ? "down" : x < P.x ? "left" : "right";
    await say(T.hi);
    const res = await battle(T.team.map(([sp, l]) => mk(sp, l)), { name: T.name, short: T.short });
    if (res === "win") {
      await say(T.bye);
      G.flags[T.flag] = true; G.map[y][x] = ",";
      save();
    }
  }
  async function imbissScript() {
    await say("Imbiss-Ilse: Na, Hunger? Für dein Team geht's aufs Haus.");
    healAll();
    if (G.items.haken < 5) G.items.haken = 5;
    if (G.items.brotzeit < 3) G.items.brotzeit = 3;
    snd.heal();
    await say("Alle sind wieder fit. 5 Kranhaken und 3 Brotzeiten liegen bereit.");
    save();
    await say("Spielstand gespeichert.");
  }

  // ================= ARENA & ORDEN =================
  function buildOrden(i) {
    const c = mkc(32, 32), g = c.getContext("2d");
    const R = (x, y, w, h, col) => px(g, x, y, w, h, col);
    const band = [2, 0, 1][i], face = [2, 0, 1][i];
    R(8, 0, 7, 13, 3); R(9, 0, 5, 12, band); R(17, 0, 7, 13, 3); R(18, 0, 5, 12, band);
    R(11, 0, 1, 12, 3); R(20, 0, 1, 12, 3);
    for (let dy = -10; dy <= 10; dy++) { const h = Math.round(10.5 * Math.sqrt(1 - (dy * dy) / 110)); R(16 - h, 21 + dy, h * 2, 1, 3); }
    for (let dy = -9; dy <= 9; dy++) { const h = Math.round(9 * Math.sqrt(1 - (dy * dy) / 81)); R(16 - h, 21 + dy, h * 2, 1, face); }
    if (i === 0) { R(10, 17, 12, 9, 3); R(11, 18, 5, 3, 1); R(17, 18, 4, 3, 1); R(11, 22, 2, 3, 1); R(14, 22, 7, 3, 1); }
    else if (i === 1) { R(10, 16, 12, 3, 3); R(10, 24, 12, 3, 3); R(14, 18, 4, 7, 3); R(11, 17, 10, 1, 2); R(11, 25, 10, 1, 2); }
    else {
      [[15, 13, 2], [14, 14, 4], [13, 15, 6], [14, 16, 4], [13, 17, 6], [12, 18, 8], [13, 19, 6], [12, 20, 8], [11, 21, 10], [10, 22, 12]]
        .forEach(([x, y, w]) => R(x, y, w, 1, 3));
      R(15, 23, 2, 5, 3); R(12, 27, 8, 1, 3);
      R(14, 17, 1, 1, 0); R(17, 19, 1, 1, 0); R(13, 21, 1, 1, 0); R(18, 21, 1, 1, 0); R(16, 15, 1, 1, 0);
    }
    return c;
  }
  const ORDEN_IMG = ORDEN.map((o, i) => buildOrden(i));
  function ordenURL(i, got) {
    const k = "orden" + i + (got ? "" : "_s");
    if (URLS[k]) return URLS[k];
    if (got) return (URLS[k] = ORDEN_IMG[i].toDataURL());
    const c = mkc(32, 32), g = c.getContext("2d");
    g.drawImage(ORDEN_IMG[i], 0, 0); g.globalCompositeOperation = "source-in"; g.fillStyle = PAL[1]; g.fillRect(0, 0, 32, 32);
    return (URLS[k] = c.toDataURL());
  }
  async function ordenMenu() {
    const items = ORDEN.map((o, i) => {
      const got = G.orden.includes(o.id);
      return `<div class="cat${got ? " got" : ""}"><img src="${ordenURL(i, got)}" alt=""><span>${got ? o.name : "???"}</span><small>${o.cup}</small></div>`;
    }).join("");
    const hint = G.orden.length === 3 ? "Du bist Baumeister! Alle Orden gewonnen."
      : G.flags.ended ? "Die Orden gibt es in der Baumeister-Arena im Steinbruch." : "Erst zum Richtfest, dann öffnet sich das Osttor.";
    await choose(["Zurück"], { variant: "full", header: `Orden · ${G.orden.length}/3<div class="orden-grid">${items}</div><p class="info-dex">${hint}</p>`, cancel: true });
  }
  const cupOpen = (i) => i === 0 || G.orden.includes(ORDEN[i - 1].id);
  async function arenaScript() {
    P.dir = "up";
    await say("Arena-Sprecher: Willkommen in der Baumeister-Arena!");
    while (true) {
      const i = await choose([...ORDEN.map((o) => o.cup), "Zurück"], {
        variant: "full", header: "Welchen Cup willst du spielen?", cancel: true,
        info: (k) => k >= ORDEN.length ? "Wieder nach draußen."
          : `${ORDEN[k].lv} · 3 Runden · ` + (G.orden.includes(ORDEN[k].id) ? "Orden schon gewonnen" : cupOpen(k) ? `Preis: <b>${ORDEN[k].name}</b>` : `Erst den ${ORDEN[k - 1].cup} gewinnen`)
      });
      if (i < 0 || i >= ORDEN.length) { await say("Arena-Sprecher: Komm wieder, wenn dein Team bereit ist!"); return; }
      if (!cupOpen(i)) { await say(`Für den ${ORDEN[i].cup} brauchst du erst den ${ORDEN[i - 1].name}.`); continue; }
      const c = await choose(["Los geht's", "Lieber nicht"], { variant: "side", header: "3 Runden am Stück. Bereit?", cancel: true });
      if (c !== 0) continue;
      await runCup(i);
      return;
    }
  }
  async function runCup(i) {
    const cup = CUPS[i], o = ORDEN[i];
    healAll();
    await say(`Arena-Sprecher: Der ${o.cup} beginnt! Dein Team startet frisch, zwischen den Runden gibt es eine Trinkpause.`);
    for (let r = 0; r < cup.length; r++) {
      const T = cup[r];
      await say(r === cup.length - 1 ? `Finale! ${T.name} betritt die Arena!` : `Runde ${r + 1}: ${T.name}!`);
      const res = await battle(T.team.map(([sp, l]) => mk(sp, l)), { name: T.name, short: T.short });
      if (res !== "win") return;
      if (r < cup.length - 1) {
        for (const m of G.team) { const mx = stats(m).maxhp; m.hp = Math.min(mx, m.hp + Math.ceil(mx / 2)); }
        snd.heal();
        await say("Trinkpause! Jedes Baumonster aus deinem Team kommt wieder auf die Beine und erholt sich ein Stück.");
      }
    }
    snd.level();
    if (G.orden.includes(o.id)) {
      await say(`Arena-Sprecher: Wieder gewonnen! Den ${o.name} hast du ja schon. Starke Truppe!`);
      save();
      return;
    }
    G.orden.push(o.id);
    let prize = "";
    if (i === 0) { G.items.brotzeit += 3; prize = "Dazu gibt's 3 Brotzeiten."; }
    else if (i === 1) { G.items.haken += 5; prize = "Dazu gibt's 5 Kranhaken."; }
    else prize = "Du bist jetzt offiziell Baumeister!";
    save();
    const header = `<div class="end"><img class="info-img" style="align-self:center;width:calc(var(--u)*48);height:calc(var(--u)*48)" src="${ordenURL(i, true)}" alt=""><div class="end-s">Du hast den<br><b>${o.name}</b> gewonnen!</div><p>${prize}<br>Orden ${G.orden.length}/3</p></div>`;
    await choose(["Super!"], { variant: "full", header });
  }
  async function polierScript() {
    if (G.flags.polier) return;
    P.dir = "up";
    await say("Polier Paul: Halt! Zum Richtfest kommt nur, wer seine Truppe im Griff hat.");
    await say("Polier Paul: Zeig mal, was du draufhast!");
    const res = await battle([mk("ziegelzwerg", 7), mk("baggerling", 7), mk("balkenbaer", 8)], { name: "Polier Paul", short: "Pauls" });
    if (res === "win") {
      await say("Polier Paul: Saubere Arbeit, Azubi. Der Weg zum Richtfest ist frei!");
      G.flags.polier = true; G.map[7][9] = ","; G.map[7][10] = ",";
      save();
    }
  }
  async function healerScript() {
    await say("Bauleiterin Bea: Kurze Brotzeit für dein Team?");
    healAll();
    if (G.items.haken < 5) G.items.haken = 5;
    snd.heal();
    await say("Alle sind wieder fit. Deine Kranhaken hab ich auf 5 aufgefüllt.");
    save();
    await say("Spielstand gespeichert.");
  }
  async function endingScript() {
    await say("Der Richtkranz hängt, die Blaskapelle spielt.");
    await say("Glückwunsch! Du hast es zum Richtfest geschafft.");
    const first = !G.flags.ended;
    G.flags.ended = true; snd.level();
    const header = `<div class="end"><div class="end-t">Richtfest!</div><div class="end-s">Katalog ${G.caught.length}/${ALLE} gefangen · Orden ${G.orden.length}/3<br>${G.stats.fights} Kämpfe · ${G.stats.catches} Fänge</div><p>Das Osttor zum Steinbruch ist jetzt offen. Dort warten neue Baumonster, starke Gegner und die Baumeister-Arena.</p></div>`;
    await choose(["Weiterbauen"], { variant: "full", header });
    Object.assign(P, { y: 5, fy: 5, fx: P.x, t: 1, moving: false, dir: "down" });
    save();
    if (first) await say("Polier Paul ruft: Das Osttor ist auf! Rechts hinter dem Kran geht's in den Steinbruch.");
  }
  async function newGame() {
    resetState();
    G.scene = "starter"; G.starterSel = 0;
    await say("Bauleiterin Bea: Ah, der neue Azubi! Willkommen auf der Baustelle.");
    await say("Ohne Baumonster läuft hier nichts. Such dir einen Kollegen aus!");
    let pick = -1;
    while (pick < 0) {
      hideBox();
      const k = await choose(STARTERS.map((sp) => SPECIES[sp].name), {
        variant: "bottom", cols: 3, start: G.starterSel,
        onMove: (j) => { G.starterSel = j; },
        info: (j) => { const S = SPECIES[STARTERS[j]]; return `<b>${TYPE_NAME[S.type]}</b> · ${S.dex}`; }
      });
      const c = await choose(["Ja", "Nein"], { variant: "side", header: `${SPECIES[STARTERS[k]].name} nehmen?`, cancel: true });
      if (c === 0) pick = k;
    }
    const sp = STARTERS[pick], m = mk(sp, 5);
    G.starter = sp; G.team = [m]; markSeen(sp); G.caught.push(sp);
    snd.level();
    await say(`${name(m)} ist jetzt dein Kollege!`);
    await say("Hier: 5 Kranhaken und 3 Brotzeiten. Mit dem Haken nimmst du wilde Baumonster mit.");
    await say("Das Richtfest ist ganz im Norden. Erst musst du aber am Polier vorbei. Viel Erfolg!");
    G.scene = "world";
    save();
  }
  async function titleFlow() {
    while (true) {
      G.scene = "title"; $("title").hidden = false;
      const s = loadSave();
      const i = await choose(s ? ["Weiterspielen", "Neues Spiel"] : ["Neues Spiel"], { variant: "title" });
      if (s && i === 0) { $("title").hidden = true; applySave(s); G.scene = "world"; return; }
      if (s) {
        const c = await choose(["Ja, neu", "Nein"], { variant: "title", header: "Alter Spielstand wird überschrieben." });
        if (c !== 0) continue;
      }
      $("title").hidden = true;
      await newGame();
      return;
    }
  }

  // ================= RENDER =================
  function scanEllipse(cx, cy, rx, ry, c) {
    for (let dy = -ry; dy <= ry; dy++) { const h = Math.round(rx * Math.sqrt(1 - (dy * dy) / (ry * ry))); px(ctx, cx - h, cy + dy, h * 2, 1, c); }
  }
  function tileImg(ch, x, y) {
    if (ch === "C" && tileAt(x, y - 1) !== "C") return TILES.Ctop;
    if (ch === "R" && tileAt(x, y - 1) !== "R") return TILES.Rtop;
    if (ch === "A" && tileAt(x, y - 1) !== "A") return TILES.Atop;
    if (ch === "X") return G.area === "steinbruch" || G.flags.ended ? TILES.Xopen : TILES.X;
    return TILES[ch] || TILES["."];
  }
  function drawWorld() {
    const k = P.moving ? P.t : 1;
    const wx = (P.fx + (P.x - P.fx) * k) * T, wy = (P.fy + (P.y - P.fy) * k) * T;
    const camX = Math.round(clamp(wx - 72, 0, MW * T - W)), camY = Math.round(clamp(wy - 64, 0, MH * T - H));
    const x0 = Math.floor(camX / T), y0 = Math.floor(camY / T);
    for (let y = y0; y <= y0 + 9 && y < MH; y++) for (let x = x0; x <= x0 + 10 && x < MW; x++) ctx.drawImage(tileImg(G.map[y][x], x, y), x * T - camX, y * T - camY);
    const frame = P.moving && P.t < 0.5 ? (P.step ? 1 : 2) : 0;
    ctx.drawImage(PLAYER[P.dir + frame], Math.round(wx - camX), Math.round(wy - camY) - 2);
  }
  function drawHook(h) {
    const x = Math.round(h.x + h.dx), y = Math.round(h.y);
    if (y > 0) px(ctx, x, 0, 1, y, 3);
    if (h.crate) {
      px(ctx, x - 1, y, 3, 5, 3);
      px(ctx, x - 9, y + 4, 19, 16, 3); px(ctx, x - 8, y + 5, 17, 14, 2);
      px(ctx, x - 8, y + 9, 17, 1, 3); px(ctx, x - 8, y + 14, 17, 1, 3);
      px(ctx, x - 4, y + 5, 1, 14, 1); px(ctx, x + 3, y + 5, 1, 14, 1);
    } else {
      px(ctx, x - 5, y, 11, 6, 3); px(ctx, x - 4, y + 1, 9, 4, 1);
      px(ctx, x, y + 6, 2, 6, 3); px(ctx, x - 3, y + 11, 5, 2, 3); px(ctx, x - 4, y + 8, 2, 4, 3);
    }
  }
  function drawBattle() {
    px(ctx, 0, 0, W, H, 0);
    scanEllipse(124, 58, 30, 5, 1); scanEllipse(36, 99, 32, 5, 1);
    if (B.foe && B.foeVis) ctx.drawImage(MONS[B.foe.sp].flip, Math.round(92 + B.foeOff + B.foeDx), Math.round(B.foeDy), 64, 64);
    if (B.me && B.meVis) ctx.drawImage(MONS[B.me.sp].normal, Math.round(4 + B.meOff + B.meDx), Math.round(38 + B.meDy), 64, 64);
    if (B.hook) drawHook(B.hook);
  }
  function drawStarter(t) {
    px(ctx, 0, 0, W, H, 0);
    STARTERS.forEach((sp, i) => {
      const x = 16 + i * 48;
      if (i === G.starterSel) px(ctx, x - 2, 38, 36, 2, 3);
      ctx.drawImage(MONS[sp].normal, x, 4);
    });
    const bob = reduced ? 0 : Math.round(Math.sin(t * 4) * 1.5);
    scanEllipse(80, 98, 34, 5, 1);
    ctx.drawImage(MONS[STARTERS[G.starterSel]].normal, 48, 36 + bob, 64, 64);
  }
  function drawTitle(t) {
    px(ctx, 0, 0, W, H, 0);
    px(ctx, 0, 112, W, 32, 1); px(ctx, 0, 112, W, 2, 3);
    for (let x = 4; x < W; x += 12) px(ctx, x, 122, 6, 1, 2);
    px(ctx, 126, 46, 1, 66, 3); px(ctx, 133, 46, 1, 66, 3); px(ctx, 127, 46, 1, 66, 1); px(ctx, 132, 46, 1, 66, 1);
    for (let y = 46; y < 112; y++) { const m = (y - 46) % 8, d = m < 4 ? m : 7 - m; px(ctx, 128 + d, y, 1, 1, 3); }
    px(ctx, 60, 44, 82, 1, 3); px(ctx, 60, 50, 82, 1, 3); px(ctx, 60, 45, 82, 1, 1); px(ctx, 60, 49, 82, 1, 1);
    for (let x = 60; x < 142; x++) { const m = (x - 60) % 8, d = m < 4 ? m : 7 - m; px(ctx, x, 46 + d, 1, 1, 3); }
    const sw = reduced ? 0 : Math.round(Math.sin(t * 1.6) * 2);
    px(ctx, 100 + sw, 51, 1, 28, 3); px(ctx, 96 + sw, 79, 9, 5, 3); px(ctx, 97 + sw, 80, 7, 3, 1);
    const bob = reduced ? 0 : (Math.sin(t * 3) > 0 ? 1 : 0);

  function draw(t) {

  // ================= LOOP =================
  function fit() { const w = screenEl.clientWidth || 320; screenEl.style.setProperty("--u", (w / 160) + "px"); }

  let last = performance.now();

    if (G.scene === "world") updateWorld(dt);
    draw(now / 1000);
    requestAnimationFrame(frame);

  runScript(titleFlow);
})();
