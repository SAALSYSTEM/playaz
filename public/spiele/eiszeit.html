<style>
/* EISZEIT: runde Spielzeugwelt. Alles in Fredoka, Farben aus den Bildvorlagen (Eisblau, Flussblau, Erdbeerrot, Sonnengelb). */
:root{
  --ice:#7cc8f0;
  --river:#1e88e5;
  --navy:#16325c;
  --navy-2:#3a5680;
  --berry:#ff5a6e;
  --sun:#ffc93c;
  --sun-deep:#e3a114;
  --snow:#f5f9ff;
  --font:"Fredoka","Arial Rounded MT Bold","Nunito",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#e6f3fd;color:var(--navy);font-family:var(--font);overflow:hidden;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{display:block;width:100%;height:100%}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 100px 0;pointer-events:none}
.coins{position:relative;display:flex;align-items:center;height:42px;padding:0 18px 0 48px;background:#fff;border-radius:999px;box-shadow:0 4px 0 rgba(22,50,92,.16),0 10px 22px rgba(22,50,92,.12);font:700 25px/1 var(--font);font-variant-numeric:tabular-nums;color:var(--navy)}
.coins img{position:absolute;left:-8px;top:50%;width:54px;height:54px;transform:translateY(-52%)}
.bump{animation:bump .22s ease-out}
@keyframes bump{0%{transform:scale(1.16)}100%{transform:scale(1)}}
.btn-round{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);width:34px;height:34px;padding:0;border:0;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.86);box-shadow:0 3px 0 rgba(22,50,92,.16);cursor:pointer}
.btn-round img{width:30px;height:30px}
#sound{left:16px}
#pauseBtn{right:16px}

.hint{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100% - 28px);padding:6px 16px 6px 8px;background:rgba(255,255,255,.95);border-radius:999px;box-shadow:0 4px 0 rgba(22,50,92,.13);font:600 17px/1.15 var(--font);color:var(--navy);white-space:nowrap;pointer-events:none}
.hint img{width:34px;height:34px;flex:none}
.hint.in{animation:hintIn .35s ease-out}
@keyframes hintIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

.toast{position:absolute;left:50%;top:36%;display:flex;align-items:center;gap:10px;padding:10px 22px 10px 12px;background:#fff;border-radius:22px;box-shadow:0 6px 0 rgba(22,50,92,.15),0 18px 40px rgba(22,50,92,.18);font:700 24px/1.1 var(--font);color:var(--navy);white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-50%)}
.toast img{width:50px;height:50px}
.toast.show{animation:toast 2.3s ease-out forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.07)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}

.joy{position:absolute;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:3px solid rgba(255,255,255,.9);background:rgba(255,255,255,.24);box-shadow:0 4px 18px rgba(22,50,92,.12);pointer-events:none}
.joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fff;box-shadow:0 4px 10px rgba(22,50,92,.25)}

/* Startbild */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.3vh,20px);padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 22px);background:radial-gradient(130% 75% at 50% 0%,#ffffff 0%,#e6f4fd 46%,#c3e5f9 100%);overflow:auto;transition:opacity .45s ease,visibility .45s}
.screen.out{opacity:0;visibility:hidden}
.flakes{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#fff 0 2px,transparent 2.5px),radial-gradient(circle,rgba(255,255,255,.85) 0 1.5px,transparent 2px);background-size:90px 90px,54px 54px;background-position:0 0,27px 31px;opacity:.9}
.logo{position:relative;width:min(92vw,500px);height:auto;filter:drop-shadow(0 6px 10px rgba(30,136,229,.22))}
.poster{position:relative;width:min(86vw,500px);aspect-ratio:3/2;flex:none;border-radius:22px;overflow:hidden;border:5px solid #fff;background:#cfe9fb;box-shadow:0 10px 0 rgba(22,50,92,.08),0 20px 40px rgba(22,50,92,.2);transform:rotate(-1.5deg)}
.poster img{display:block;width:100%;height:100%;object-fit:cover}
.lead{position:relative;margin:0;max-width:30ch;text-align:center;font:500 clamp(17px,4.4vw,20px)/1.35 var(--font);color:var(--navy-2);text-wrap:balance}
.btn{position:relative;min-width:min(78vw,320px);height:64px;padding:0 24px;border:0;border-radius:22px;background:var(--sun);color:var(--navy);font:700 30px/1 var(--font);box-shadow:0 7px 0 var(--sun-deep),0 16px 28px rgba(227,161,20,.32);cursor:pointer;transition:transform .08s ease}
.btn:active{transform:translateY(4px);box-shadow:0 3px 0 var(--sun-deep),0 8px 16px rgba(227,161,20,.28)}
.btn:disabled{filter:grayscale(.5);opacity:.7}
.btn.ghost{height:54px;background:#fff;font-size:22px;color:var(--navy-2);box-shadow:0 5px 0 #cbd9ea,0 10px 20px rgba(22,50,92,.1)}
.small{position:relative;margin:0;font:500 14px/1.35 var(--font);color:#5d7698;text-align:center}
.btn:focus-visible,.btn-round:focus-visible{outline:4px solid var(--river);outline-offset:3px}

/* Pause */
.backdrop{position:absolute;inset:0;background:rgba(22,50,92,.35)}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,340px);display:grid;gap:14px;padding:24px 20px 24px;background:#fff;border-radius:28px;box-shadow:0 8px 0 rgba(22,50,92,.12),0 24px 60px rgba(22,50,92,.3);text-align:center}
.panel h2{margin:0 0 4px;font:700 34px/1 var(--font);color:var(--navy)}
.panel .btn{min-width:0;width:100%}
.stats{display:flex;justify-content:center;gap:18px;margin:0 0 4px;font:600 16px/1 var(--font);color:var(--navy-2)}
.stats span{display:inline-flex;align-items:center;gap:6px}
.stats img{width:30px;height:30px}

@media (max-height:660px){.poster{display:none}}
@media (prefers-reduced-motion:reduce){.bump,.hint.in{animation:none}.toast.show{animation-duration:.01s;animation-delay:0s}}

<div id="game" aria-label="Spielfeld">

  <button id="pauseBtn" class="btn-round" type="button" hidden aria-label="Pause"><img src="eiszeit/icon-pause.webp" alt=""></button>

    <button id="play" class="btn" type="button" disabled>Lädt …</button>

  <section id="pause" hidden>

    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">

      <button id="resume" class="btn" type="button">Weiter</button>
      <button id="reset" class="btn ghost" type="button">Von vorne</button>
    </div>
  </section>

  <section id="err" class="screen" hidden><p id="errText" class="lead"></p></section>
</div>

<script src="../assets/three.min.js"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const els = {
    canvas: $('c'), hud: $('hud'), coins: $('coins'), coinNum: $('coinNum'), sound: $('sound'), soundIcon: $('soundIcon'),
    pauseBtn: $('pauseBtn'), hint: $('hint'), hintIcon: $('hintIcon'), hintText: $('hintText'), toast: $('toast'),
    toastIcon: $('toastIcon'), toastText: $('toastText'), joy: $('joy'), knob: $('knob'), start: $('start'), play: $('play'),
    pause: $('pause'), resume: $('resume'), reset: $('reset'), statSold: $('statSold'), err: $('err'), errText: $('errText')
  };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  const KEY_SAVE = 'eiszeit.v1';
  const KEY_MUTED = 'eiszeit.muted';
  const ASSET = 'eiszeit/';
  const ICON = (n) => ASSET + 'icon-' + n + '.webp';

  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  /* ---------- Spielregeln ---------- */
  const CFG = {
    speed: 4.7,           // Laufgeschwindigkeit
    carryMax: 14,         // so viel trägt das Kind
    pileMax: 36,          // Erdbeeren am Steg
    hopperMax: 30,        // Erdbeeren in der Maschine
    outMax: 24,           // fertige Eistüten an der Ausgabe
    counterMax: 24,       // Eistüten auf der Theke
    coinPerCone: 4,
    // Eismaschine Stufe 1–4: schneller UND mehr Kunden (sonst bringt die schnellere Maschine nichts,
    // weil die Kunden der Engpass sind)
    machinePrices: [250, 700, 1600],
    conePeriods: [0.6, 0.45, 0.34, 0.25],   // Sekunden pro Eistüte
    spawnPeriods: [2.6, 1.9, 1.4, 1.05],    // Sekunden bis zum nächsten Kunden
    servePeriods: [0.3, 0.26, 0.22, 0.19],  // Sekunden pro Eistüte an der Theke
    throwPeriod: 0.95,    // Pinguin: Sekunden pro Schneeball
    blockHp: 2,           // Schneebälle pro Eisblock
    helperPrices: [30, 80, 180, 350],
    queueMax: 9,
    queueMin: 5,           // so viele Tiere sollen mindestens warten (sonst kommt sofort Nachschub)
    customerSpeed: 3.6,
    iceHelperPrice: 600,   // Eis-Helfer: Maschine -> Theke
    iceHelperMax: 8,
    iceHelper2Price: 2000,  // zweiter Eis-Helfer
    counter2Price: 900,    // zweite Theke
    carrierPrice: 400,     // Erdbeer-Träger
    carrierMax: 6,
    carrierSpeed: 2.4,
    blockSpeed: 0.9,       // Eisblöcke im Fluss
    blockGap: 1.2,
    blocksPerHelper: 2,    // so viele freie Blöcke soll jeder Pinguin vor sich haben
    blocksMaxPerHelper: 4, // höchstens so viele Blöcke gleichzeitig im Fluss (+4), damit es nicht zu voll wird
    startPile: 8,
    // Blaubeer-Garten (neuer Bereich, wenn alles andere freigeschaltet ist)
    gardenPrice: 2500,
    pickerPrice: 2500,      // Blaubeer-Helfer
    coinPerBlue: 9,        // Blaubeer-Eis ist mehr wert
    bushMax: 6,            // Beeren pro Busch
    bushGrow: 1.8,         // Sekunden, bis eine Beere nachwächst
    blueHopperMax: 30,
    blueOutMax: 24,
    bluePeriod: 0.5,       // Blaubeer-Maschine: Sekunden pro Eistüte
    blueSpawnFactor: 0.8,  // mit Blaubeer-Eis kommen mehr Kunden
    // Kakao-Insel hinter der Brücke
    bridgePrice: 8000,
    cocoaHelperPrice: 6000,
    coinPerChoc: 15,
    treeMax: 6, treeGrow: 2.2,
    chocHopperMax: 30, chocOutMax: 24, chocPeriod: 0.5,
    // kleine Störungen: Helfer wollen Münzen, Maschinen gehen kaputt
    pauseEvery: [40, 75], pauseCost: [25, 0.08],   // mindestens 25 oder 8 % vom Ersparten
    breakEvery: [70, 120], repairTime: 1.2, repairCost: [60, 0.15]
  };

  /* Weltaufbau. Kamera schaut schräg von +x/+z, also: -x/-z ist oben am Bildschirm. */
  const L = {
    bankX: -5.66,
    dock: { x0: -6.25, x1: -3.55, z0: -7.9, z1: 3.5 },
    walkDock: { x0: -5.95, x1: -3.4, z0: -7.55, z1: 3.15 },
    plaza: { x0: -3.75, x1: 4.45, z0: -6.75, z1: 6.6 },
    slots: [-2.4, -0.2, -4.6, 2.0, -6.8],
    helperX: -5.5,
    unlockX: -4.45,
    carrierUnlock: { x: -0.2, z: -1.9 },
    machineUnlock: { x: -2.55, z: -5.25 },
    hole: { x: -1.3, z: 1.35 },          // Eisloch: hier kann man alles ins Wasser werfen
    // Blaubeer-Garten südlich vom Platz (unten links im Bild)
    garden: { x0: -3.4, x1: 4.3, z0: 6.4, z1: 12.8 },
    gardenGate: { x: 0.45, z: 5.95 },
    bushes: [[-2.55, 7.92], [-1.55, 12.2], [-1.13, 8.77], [-2.55, 11.13]],
    blueMachine: { x: 0.71, z: 9.19 },
    blueInput: { x: -0.14, z: 11.6 },
    blueOutput: { x: 3.42, z: 10.0 },
    pickerUnlock: { x: 3.25, z: 6.93 },
    hole2: { x: 1.98, z: 12.16 },
    // Kakao-Insel auf der anderen Flussseite, Brücke vom Blaubeer-Garten aus
    island: { x0: -16.6, x1: -12.3, z0: 5.6, z1: 13.0 },
    bridge: { x0: -12.6, x1: -3.2, z0: 9.15, z1: 10.25 },
    bridgeUnlock: { x: -2.75, z: 9.7 },
    trees: [[-16.0, 12.3], [-14.4, 12.6], [-14.6, 10.7], [-12.95, 12.2]],
    chocMachine: { x: -15.5, z: 7.3 },
    chocInput: { x: -16.2, z: 9.55 },
    chocOutput: { x: -12.95, z: 8.2 },
    cocoaUnlock: { x: -14.2, z: 6.15 },
    hole3: { x: -12.85, z: 6.2 },
    pile: { x: -2.95, z: -1.55 },
    igloo: { x: -2.2, z: -8.7, r: 2.25 },
    machine: { x: -0.75, z: -5.75 },
    input: { x: -1.6, z: -3.35 },
    output: { x: 1.95, z: -4.95 },
    counter: { x: 4.1, z: -0.99, len: 3.0, w: 1.1, h: 0.92 },
    drop: { x: 2.95, z: -0.99 },
    counter2: { x: 4.1, z: 2.75, len: 2.3 },
    drop2: { x: 2.95, z: 2.75 },
    iceUnlock: { x: 1.5, z: -2.85 },
    coin: { x: 0.7, z: 3.2 },
    laneX: 5.6,
    q0z: -0.99,
    qGap: 1.22
  };
  const SQ = Math.SQRT1_2;
  // Bildschirm-Koordinaten (u rechts, v runter) in Welt umrechnen
  const W = (u, v) => ({ x: (u + v) * SQ, z: (v - u) * SQ });

  function fail(msg) {
    els.start.hidden = true; els.err.hidden = false; els.errText.textContent = msg;
  }
  function loadImg(src) {
    return new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  }

  /* ---------- Ton (WebAudio, alles synthetisch) ---------- */
  const sfx = (() => {
    let ctx = null, master = null, noiseBuf = null;
    let muted = !!store.get(KEY_MUTED, false);
    const last = {};
    function init() {
      if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ctx.destination);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { ctx = null; }
    }
    function gap(name, ms) { const n = performance.now(); if (last[name] && n - last[name] < ms) return false; last[name] = n; return true; }
    function tone(f, d, type, v, f2, delay) {
      if (!ctx || muted) return;
      const t = ctx.currentTime + (delay || 0);
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v || 0.2, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.03);
    }
    function noise(d, v, freq, type, delay) {
      if (!ctx || muted || !noiseBuf) return;
      const t = ctx.currentTime + (delay || 0);
      const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noiseBuf; f.type = type || 'bandpass'; f.frequency.value = freq || 1500; f.Q.value = 0.8;
      g.gain.setValueAtTime(v || 0.1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d + 0.02);
    }
    return {
      init,
      get muted() { return muted; },
      setMuted(m) { muted = m; store.set(KEY_MUTED, m); if (master) master.gain.value = m ? 0 : 0.5; },
      pick(n) { if (gap('pick', 40)) tone(480 + Math.min(n, 18) * 34, 0.09, 'sine', 0.16); },
      drop(n) { if (gap('drop', 40)) tone(760 - Math.min(n, 18) * 16, 0.08, 'triangle', 0.13); },
      throw() { if (gap('throw', 70)) noise(0.11, 0.05, 2200, 'bandpass'); },
      hit() { if (gap('hit', 50)) { noise(0.07, 0.09, 3200, 'highpass'); tone(1500, 0.05, 'sine', 0.04); } },
      burst() { if (gap('burst', 60)) { noise(0.2, 0.13, 2600, 'highpass'); tone(880, 0.14, 'sine', 0.09, 1320); } },
      coin() { if (gap('coin', 34)) { tone(1318, 0.05, 'square', 0.035); tone(1760, 0.09, 'square', 0.035, 0, 0.045); } },
      pay() { if (gap('pay', 40)) tone(1046, 0.06, 'square', 0.03); },
      happy() { tone(660, 0.12, 'sine', 0.12, 990); tone(990, 0.15, 'sine', 0.1, 1320, 0.1); },
      unlock() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.2, 'triangle', 0.14, 0, i * 0.08)); },
      pop() { tone(420, 0.12, 'sine', 0.14, 820); },
      splash() { if (gap('splash', 60)) { noise(0.22, 0.12, 700, 'lowpass'); tone(380, 0.16, 'sine', 0.09, 140); } }
    };
  })();

  /* ---------- Start ---------- */
  async function boot() {
    if (!window.THREE) { fail('Die 3D-Grafik konnte nicht geladen werden. Lade die Seite bitte neu.'); return; }
    const names = ['muenze', 'erdbeere', 'eistuete', 'helfer', 'stern', 'korb', 'upgrade', 'blaubeere', 'eistuete-blau', 'kakao', 'eistuete-schoko', 'bruecke'];
    const imgs = {};
    const fontLoad = (document.fonts && document.fonts.load)
      ? Promise.race([Promise.all([document.fonts.load('700 40px Fredoka'), document.fonts.load('600 40px Fredoka')]), sleep(2000)]).catch(() => {})
      : Promise.resolve();
    const [boden] = await Promise.all([
      loadImg(ASSET + 'boden.webp'),
      Promise.all(names.map((n) => loadImg(ICON(n)).then((i) => { imgs[n] = i; }))),
      fontLoad
    ]);
    imgs.boden = boden;
    game(imgs);
  }

  function game(imgs) {
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas: els.canvas, antialias: true, powerPreference: 'high-performance' });
    } catch (e) {
      fail('Dein Browser kann leider keine 3D-Grafik (WebGL) darstellen. Probier es in Chrome, Safari oder Firefox.');
      return;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    const maxAniso = Math.min(4, renderer.capabilities.getMaxAnisotropy());

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe9f4fe);
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
    const CAM_DIR = new THREE.Vector3(1, 1.42, 1).normalize();
    const camT = new THREE.Vector3(0, 0, 0);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x9fb7d6, 0.6));
    const sun = new THREE.DirectionalLight(0xfff1dc, 0.5);
    sun.position.set(-6, 12, 5);
    scene.add(sun);

    /* ---------- Hilfen: Leinwand-Texturen ---------- */
    function canvas(w, h, draw) {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); draw(g, w, h); return c;
    }
    function tex(c, repeat) {
      const t = new THREE.CanvasTexture(c);
      if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
      t.anisotropy = maxAniso;
      return t;
    }
    function rr(g, x, y, w, h, r) {
      g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
      g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
    }
    function star(g, cx, cy, ro, ri, n) {
      g.beginPath();
      for (let i = 0; i < n * 2; i++) {
        const r = i % 2 ? ri : ro, a = -Math.PI / 2 + (i * Math.PI) / n;
        g[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      }
      g.closePath();
    }

    /* Atlas für Erdbeeren, Eistüten und Münzen: ein Material für alle Gegenstände */
    const A = 512;
    const REG = {
      berry: [0, 0, 256, 256], leaf: [256, 0, 128, 128], edge: [384, 0, 128, 128],
      coin: [256, 128, 128, 128], white: [384, 128, 128, 128],
      waffle: [0, 256, 256, 256], scoop: [256, 256, 256, 256]
    };
    const uvr = (r) => [r[0] / A, 1 - (r[1] + r[3]) / A, r[2] / A, r[3] / A];
    const makeAtlas = (kind, blue = kind === true, choc = kind === 'choc') => tex(canvas(A, A, (g) => {
      let [x, y, w, h] = REG.berry;
      let gr = g.createLinearGradient(0, y, 0, y + h);
      if (blue) {
        // Blaubeerhaut: dunkelblau mit hellem Reif
        gr.addColorStop(0, '#5a6fe0'); gr.addColorStop(0.5, '#3346b8'); gr.addColorStop(1, '#1f2a7a');
        g.fillStyle = gr; g.fillRect(x, y, w, h);
        g.fillStyle = 'rgba(190,205,255,.25)';
        for (let i = 0; i < 70; i++) { g.beginPath(); g.arc(x + Math.random() * w, y + Math.random() * h, 2 + Math.random() * 4, 0, TAU); g.fill(); }
      } else if (choc) {
        // Kakaofrucht: gelb-orange mit Rillen
        gr.addColorStop(0, '#ffcf3a'); gr.addColorStop(0.5, '#ff9a1f'); gr.addColorStop(1, '#d9661a');
        g.fillStyle = gr; g.fillRect(x, y, w, h);
        g.fillStyle = 'rgba(150,60,10,.28)';
        for (let i = 0; i < 10; i++) g.fillRect(x + i * (w / 10), y, 6, h);
      } else {
        // Erdbeerhaut
        gr.addColorStop(0, '#ff6b78'); gr.addColorStop(0.5, '#ff3b4e'); gr.addColorStop(1, '#e62a3f');
        g.fillStyle = gr; g.fillRect(x, y, w, h);
        g.fillStyle = '#ffd84a';
        for (let r = 0; r < 9; r++) for (let c = 0; c < 12; c++) {
          const sx = x + (c + (r % 2) * 0.5) * (w / 12) + 4, sy = y + 34 + r * 24;
          g.beginPath(); g.ellipse(sx % (x + w), sy, 3.2, 5, 0, 0, TAU); g.fill();
        }
      }
      // Blätter (bei Blaubeeren: dunkle Krone)
      [x, y, w, h] = REG.leaf;
      gr = g.createLinearGradient(0, y, 0, y + h);
      if (blue) { gr.addColorStop(0, '#2b3580'); gr.addColorStop(1, '#151a4d'); } else { gr.addColorStop(0, '#5cc25f'); gr.addColorStop(1, '#2f8f43'); }
      g.fillStyle = gr; g.fillRect(x, y, w, h);
      // Münzrand
      [x, y, w, h] = REG.edge;
      g.fillStyle = '#f2ac1c'; g.fillRect(x, y, w, h);
      g.fillStyle = '#ffd25a'; for (let i = 0; i < 16; i++) g.fillRect(x + i * 8, y, 3, h);
      // Münzseite mit Stern
      [x, y, w, h] = REG.coin;
      gr = g.createRadialGradient(x + w * 0.4, y + h * 0.35, 4, x + w / 2, y + h / 2, w * 0.6);
      gr.addColorStop(0, '#ffe58a'); gr.addColorStop(1, '#ffbf24');
      g.fillStyle = gr; g.fillRect(x, y, w, h);
      g.strokeStyle = '#f0a81a'; g.lineWidth = 8; g.beginPath(); g.arc(x + w / 2, y + h / 2, w * 0.36, 0, TAU); g.stroke();
      g.fillStyle = '#f5a914'; star(g, x + w / 2, y + h / 2 + 2, w * 0.25, w * 0.12, 5); g.fill();
      g.fillStyle = '#ffd95c'; star(g, x + w / 2 - 2, y + h / 2, w * 0.21, w * 0.1, 5); g.fill();
      // Weiß
      [x, y, w, h] = REG.white; g.fillStyle = '#ffffff'; g.fillRect(x, y, w, h);
      // Waffel
      [x, y, w, h] = REG.waffle;
      g.fillStyle = '#e8a75a'; g.fillRect(x, y, w, h);
      g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
      g.strokeStyle = '#c4823b'; g.lineWidth = 5;
      for (let i = -w; i < w * 2; i += 26) {
        g.beginPath(); g.moveTo(x + i, y); g.lineTo(x + i + h, y + h); g.stroke();
        g.beginPath(); g.moveTo(x + i, y + h); g.lineTo(x + i + h, y); g.stroke();
      }
      g.restore();
      // Eiskugel mit Streuseln
      [x, y, w, h] = REG.scoop;
      gr = g.createLinearGradient(0, y, 0, y + h);
      if (blue) { gr.addColorStop(0, '#e3e6ff'); gr.addColorStop(0.55, '#a9b2ff'); gr.addColorStop(1, '#8590f2'); }
      else if (choc) { gr.addColorStop(0, '#a9714a'); gr.addColorStop(0.55, '#7a4527'); gr.addColorStop(1, '#5e321b'); }
      else { gr.addColorStop(0, '#ffd3e0'); gr.addColorStop(0.55, '#ffa9c3'); gr.addColorStop(1, '#ff8fb0'); }
      g.fillStyle = gr; g.fillRect(x, y, w, h);
      const cols = ['#ff4f6d', '#ffd23f', '#5cc8f2', '#7bd36b', '#b98cff', '#ffffff'];
      for (let i = 0; i < 60; i++) {
        g.save(); g.translate(x + 8 + Math.random() * (w - 16), y + 10 + Math.random() * (h * 0.8));
        g.rotate(Math.random() * Math.PI); g.fillStyle = cols[i % cols.length]; rr(g, -6, -2.5, 12, 5, 2.5); g.fill(); g.restore();
      }
    }));
    const atlasTex = makeAtlas(false);
    const itemMat = new THREE.MeshStandardMaterial({ map: atlasTex, roughness: 0.5, metalness: 0 });
    const blueMat = new THREE.MeshStandardMaterial({ map: makeAtlas(true), roughness: 0.45, metalness: 0 });
    const chocMat = new THREE.MeshStandardMaterial({ map: makeAtlas('choc'), roughness: 0.45, metalness: 0 });

    /* Geometrien zu einem Mesh verbacken (Farben je Teil oder Atlas-UVs) */
    const _e = new THREE.Euler(), _q = new THREE.Quaternion();
    function M(px, py, pz, sx, sy, sz, rx, ry, rz) {
      _e.set(rx || 0, ry || 0, rz || 0); _q.setFromEuler(_e);
      return new THREE.Matrix4().compose(new THREE.Vector3(px, py, pz), _q.clone(), new THREE.Vector3(sx, sy == null ? sx : sy, sz == null ? sx : sz));
    }
    function bake(parts, useUV) {
      let nv = 0, ni = 0;
      const gs = parts.map((p) => { const g = p.g.clone(); g.applyMatrix4(p.m); nv += g.attributes.position.count; ni += g.index.count; return g; });
      const pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3);
      const col = useUV ? null : new Float32Array(nv * 3);
      const uv = useUV ? new Float32Array(nv * 2) : null;
      const idx = nv > 65535 ? new Uint32Array(ni) : new Uint16Array(ni);
      let vo = 0, io = 0;
      const c = new THREE.Color();
      gs.forEach((g, i) => {
        const p = parts[i], n = g.attributes.position.count;
        pos.set(g.attributes.position.array, vo * 3);
        nor.set(g.attributes.normal.array, vo * 3);
        if (col) { c.set(p.c); for (let k = 0; k < n; k++) { col[(vo + k) * 3] = c.r; col[(vo + k) * 3 + 1] = c.g; col[(vo + k) * 3 + 2] = c.b; } }
        if (uv) {
          const a = g.attributes.uv.array, r = uvr(REG[p.r]);
          for (let k = 0; k < n; k++) { uv[(vo + k) * 2] = r[0] + clamp(a[k * 2], 0, 1) * r[2]; uv[(vo + k) * 2 + 1] = r[1] + clamp(a[k * 2 + 1], 0, 1) * r[3]; }
        }
        const ia = g.index.array; for (let k = 0; k < ia.length; k++) idx[io + k] = ia[k] + vo;
        vo += n; io += ia.length; g.dispose();
      });
      const out = new THREE.BufferGeometry();
      out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
      if (col) out.setAttribute('color', new THREE.BufferAttribute(col, 3));
      if (uv) out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
      out.setIndex(new THREE.BufferAttribute(idx, 1));
      out.computeBoundingSphere();
      return out;
    }
    const G = {
      s: new THREE.SphereGeometry(1, 18, 14),
      sl: new THREE.SphereGeometry(1, 10, 8),
      hemi: new THREE.SphereGeometry(1, 18, 9, 0, TAU, 0, Math.PI / 2),
      cyl: new THREE.CylinderGeometry(1, 1, 1, 16, 1),
      cylO: new THREE.CylinderGeometry(1, 1, 1, 18, 1, true),
      cone: new THREE.ConeGeometry(1, 1, 16, 1),
      coneO: new THREE.ConeGeometry(1, 1, 18, 1, true),
      tor: new THREE.TorusGeometry(1, 0.32, 10, 24),
      box: new THREE.BoxGeometry(1, 1, 1),
      circ: new THREE.CircleGeometry(1, 20)
    };
    const P = (g, c, m) => ({ g, c, m });
    const toyMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.6, metalness: 0 });
    const toyMatFlat = new THREE.MeshLambertMaterial({ vertexColors: true });

    /* ---------- Gegenstände ---------- */
    const berryBody = (() => {
      const g = new THREE.SphereGeometry(1, 16, 12);
      const p = g.attributes.position;
      for (let i = 0; i < p.count; i++) {
        let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
        if (y < 0) { const k = 1 - 0.42 * (-y); x *= k; z *= k; y *= 1.18; } else { y *= 0.86; }
        p.setXYZ(i, x, y, z);
      }
      g.computeVertexNormals(); return g;
    })();
    const berryParts = [{ g: berryBody, r: 'berry', m: M(0, 0.2, 0, 0.17) }];
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * TAU;
      berryParts.push({ g: G.sl, r: 'leaf', m: M(Math.sin(a) * 0.075, 0.345, Math.cos(a) * 0.075, 0.075, 0.022, 0.04, 0.35, a, 0) });
    }
    berryParts.push({ g: G.cyl, r: 'leaf', m: M(0, 0.39, 0, 0.018, 0.07, 0.018) });
    const berryGeo = bake(berryParts, true);

    const coneGeo = bake([
      { g: G.coneO, r: 'waffle', m: M(0, 0.21, 0, 0.165, 0.42, 0.165, Math.PI, 0, 0) },
      { g: G.s, r: 'scoop', m: M(0, 0.47, 0, 0.2, 0.17, 0.2) },
      { g: G.tor, r: 'scoop', m: M(0, 0.42, 0, 0.17, 0.17, 0.2, Math.PI / 2, 0, 0) },
      { g: G.s, r: 'scoop', m: M(0, 0.62, 0, 0.07) }
    ], true);

    const blueParts = [{ g: G.s, r: 'berry', m: M(0, 0.15, 0, 0.15, 0.14, 0.15) }];
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * TAU;
      blueParts.push({ g: G.cone, r: 'leaf', m: M(Math.sin(a) * 0.045, 0.29, Math.cos(a) * 0.045, 0.03, 0.06, 0.03, Math.cos(a) * 0.5, 0, -Math.sin(a) * 0.5) });
    }
    blueParts.push({ g: G.cyl, r: 'leaf', m: M(0, 0.282, 0, 0.055, 0.02, 0.055) });
    const blueberryGeo = bake(blueParts, true);
    const podGeo = bake([
      { g: G.s, r: 'berry', m: M(0, 0.17, 0, 0.11, 0.17, 0.11) },
      { g: G.cyl, r: 'leaf', m: M(0, 0.35, 0, 0.022, 0.07, 0.022) }
    ], true);

    const coinGeo = bake([
      { g: new THREE.CylinderGeometry(1, 1, 1, 22, 1, true), r: 'edge', m: M(0, 0.035, 0, 0.22, 0.07, 0.22) },
      { g: G.circ, r: 'coin', m: M(0, 0.07, 0, 0.22, 0.22, 0.22, -Math.PI / 2, 0, 0) },
      { g: G.circ, r: 'coin', m: M(0, 0, 0, 0.22, 0.22, 0.22, Math.PI / 2, 0, 0) }
    ], true);

    function makeIM(geo, mat, cap, castColor) {
      const m = new THREE.InstancedMesh(geo, mat, cap);
      m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      if (castColor) { for (let i = 0; i < cap; i++) m.setColorAt(i, new THREE.Color(1, 1, 1)); }
      m.count = 0; m.frustumCulled = false; scene.add(m); return m;
    }
    const berryIM = makeIM(berryGeo, itemMat, 340);
    const coneIM = makeIM(coneGeo, itemMat, 240);
    const coinIM = makeIM(coinGeo, itemMat, 320);
    const blueIM = makeIM(blueberryGeo, blueMat, 240);
    const bconeIM = makeIM(coneGeo, blueMat, 200);
    const podIM = makeIM(podGeo, chocMat, 200);
    const cconeIM = makeIM(coneGeo, chocMat, 200);

    const _m4 = new THREE.Matrix4(), _p3 = new THREE.Vector3(), _s3 = new THREE.Vector3();
    function put(im, x, y, z, ry, s, rx, rz, sy) {
      if (im.count >= im.instanceMatrix.count) return;
      _e.set(rx || 0, ry || 0, rz || 0); _q.setFromEuler(_e);
      _p3.set(x, y, z); _s3.set(s, sy == null ? s : sy, s);
      _m4.compose(_p3, _q, _s3); im.setMatrixAt(im.count++, _m4);
    }
    const ITEM = { berry: berryIM, cone: coneIM, coin: coinIM, blue: blueIM, bcone: bconeIM, pod: podIM, ccone: cconeIM };

    /* ---------- Boden, Fluss, Steg ---------- */
    // Schneeboden diesseits und jenseits des Flusses (der Fluss selbst bleibt frei)
    const farX = L.bankX - 6.2;
    let snowMat;
    if (imgs.boden) {
      const t = new THREE.Texture(imgs.boden); t.needsUpdate = true; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1 / 5, 1 / 5); t.anisotropy = maxAniso;
      snowMat = new THREE.MeshLambertMaterial({ map: t, color: 0xffffff });
    } else snowMat = new THREE.MeshLambertMaterial({ color: 0xf2f7ff });
    function snowField(x0, x1) {
      const g = new THREE.PlaneGeometry(x1 - x0, 160);
      const uv = g.attributes.uv, pos = g.attributes.position;
      for (let i = 0; i < uv.count; i++) uv.setXY(i, pos.getX(i) + (x0 + x1) / 2, pos.getY(i));
      const m = new THREE.Mesh(g, snowMat); m.rotation.x = -Math.PI / 2; m.position.set((x0 + x1) / 2, -0.02, 0); scene.add(m);
    }
    snowField(L.bankX - 0.2, 80);
    snowField(-80, farX + 0.4);

    // Platz aus Pflastersteinen
    const paveTex = tex(canvas(256, 256, (g) => {
      g.fillStyle = '#f8d9c6'; g.fillRect(0, 0, 256, 256);
      const shades = ['#efb895', '#ecb08b', '#f2c0a1', '#e9aa84'];
      for (let r = 0; r < 4; r++) for (let c = -1; c < 5; c++) {
        const ox = (r % 2) * 32;
        g.fillStyle = shades[(r * 5 + c * 3 + 8) % 4];
        rr(g, c * 64 + ox + 4, r * 64 + 4, 56, 56, 12); g.fill();
        g.fillStyle = 'rgba(255,255,255,.22)'; rr(g, c * 64 + ox + 10, r * 64 + 8, 40, 12, 6); g.fill();
      }
    }), true);
    paveTex.repeat.set(0.42, 0.42);
    function roundedShape(x0, z0, x1, z1, r) {
      const s = new THREE.Shape();
      // Shape liegt in x/y; nach Drehung um -90° wird y zu -z
      const a = x0, b = -z1, c = x1, d = -z0;
      s.moveTo(a + r, b); s.lineTo(c - r, b); s.quadraticCurveTo(c, b, c, b + r); s.lineTo(c, d - r);
      s.quadraticCurveTo(c, d, c - r, d); s.lineTo(a + r, d); s.quadraticCurveTo(a, d, a, d - r); s.lineTo(a, b + r); s.quadraticCurveTo(a, b, a + r, b);
      return s;
    }
    const plazaMat = new THREE.MeshLambertMaterial({ map: paveTex });
    function plazaPatch(x0, z0, x1, z1, r, y, mat) {
      const m = new THREE.Mesh(new THREE.ShapeGeometry(roundedShape(x0, z0, x1, z1, r), 6), mat || plazaMat);
      m.rotation.x = -Math.PI / 2; m.position.y = y; scene.add(m); return m;
    }
    plazaPatch(L.plaza.x0 - 0.5, L.plaza.z0 - 0.4, L.plaza.x1 + 0.45, L.plaza.z1 + 0.5, 1.6, 0.0);
    plazaPatch(L.laneX - 1.1, -3.4, L.laneX + 1.0, 12, 0.8, 0.002); // Weg für die Schlange
    // Blaubeer-Garten: lila Pflaster
    const gardenTex = tex(canvas(256, 256, (g) => {
      g.fillStyle = '#ece6fb'; g.fillRect(0, 0, 256, 256);
      const shades = ['#d6ccf4', '#cfc3f1', '#ddd4f7', '#c8bbee'];
      for (let r = 0; r < 4; r++) for (let c = -1; c < 5; c++) {
        const ox = (r % 2) * 32;
        g.fillStyle = shades[(r * 5 + c * 3 + 8) % 4];
        rr(g, c * 64 + ox + 4, r * 64 + 4, 56, 56, 12); g.fill();
        g.fillStyle = 'rgba(255,255,255,.25)'; rr(g, c * 64 + ox + 10, r * 64 + 8, 40, 12, 6); g.fill();
      }
    }), true);
    gardenTex.repeat.set(0.42, 0.42);
    plazaPatch(L.garden.x0 - 0.45, L.garden.z0 - 0.1, L.garden.x1 + 0.15, L.garden.z1 + 0.5, 1.4, -0.004, new THREE.MeshLambertMaterial({ map: gardenTex }));

    // Fluss
    const waterTex = tex(canvas(256, 256, (g) => {
      const gr = g.createLinearGradient(0, 0, 256, 0); gr.addColorStop(0, '#2a95ec'); gr.addColorStop(1, '#1b84e2');
      g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
      g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 3; g.lineCap = 'round';
      for (let i = 0; i < 14; i++) {
        const x = Math.random() * 256, y = Math.random() * 256, l = 20 + Math.random() * 40;
        g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 6, y + l / 2, x, y + l); g.stroke();
      }
      g.fillStyle = 'rgba(255,255,255,.5)';
      for (let i = 0; i < 26; i++) { g.beginPath(); g.arc(Math.random() * 256, Math.random() * 256, 1.5, 0, TAU); g.fill(); }
    }), true);
    waterTex.repeat.set(3, 12);
    const water = new THREE.Mesh(new THREE.PlaneGeometry(26, 90), new THREE.MeshLambertMaterial({ map: waterTex, color: 0xffffff }));
    water.rotation.x = -Math.PI / 2; water.position.set(L.bankX - 13, -0.22, 0); scene.add(water);

    // Ufer: Schneekante auf beiden Seiten
    const decoParts = [];
    const SNOW = '#f7fbff', SNOW2 = '#e8f1fb';
    for (let z = -40; z < 40; z += 1.1) {
      if (z > L.dock.z0 - 0.4 && z < L.dock.z1 + 0.4) continue;
      if (z > L.bridge.z0 - 0.5 && z < L.bridge.z1 + 0.5) continue;
      decoParts.push(P(G.sl, SNOW, M(L.bankX + rand(-0.1, 0.1), -0.05, z, rand(0.55, 0.75), rand(0.24, 0.34), rand(0.6, 0.8))));
    }
    for (let z = -40; z < 40; z += 1.3) {

    const CAR_S = 1.1;

        if (avail < CFG.blocksPerHelper && spawnInFreeLane(false, Math.max(SPAWN_Z, h.z - 4.2 + rand(-0.4, 0.4)))) { live++; h.feedCd = 0.6; }
      }
      // etwas Treibeis von oben, damit der Fluss lebendig bleibt
      spawnAcc = Math.min(spawnAcc + dt * 0.22, 1.5);
      if (spawnAcc >= 1 && live < cap && spawnInFreeLane(false, SPAWN_Z)) spawnAcc -= 1;
      decoT -= dt;
      if (decoT <= 0) { decoT = rand(3, 6); spawnInFreeLane(true, SPAWN_Z); }
      for (const b of blocks) {
        b.z += dt * CFG.blockSpeed;
        b.phase += dt * 2;
        b.shake = Math.max(0, b.shake - dt * 5);
        if (b.z > BLOCK_END && !b.dead) { b.dead = true; if (b.reserved) { b.reserved = false; C.pile.inc--; } }
      }
      for (let i = blocks.length - 1; i >= 0; i--) if (blocks[i].dead) blocks.splice(i, 1);
    }

    function updateHelpers(dt, time) {
      const pileFull = C.pile.n + C.pile.inc >= C.pile.max;
      for (const h of helpers) {
        h.pop = Math.min(1, h.pop + dt * 2.5);
        h.cd -= dt;
        if (h.throwT >= 0) {
          h.throwT += dt / 0.42;
          if (!h.launched && h.throwT > 0.45) {
            h.launched = true;
            const b = h.target;
            if (b && !b.dead) {
              sfx.throw();
              const dist = Math.hypot(b.x - h.x, b.z - h.z);
              snowballs.push({ from: new THREE.Vector3(h.x - 0.05, 1.25, h.z + 0.45), b, t: 0, dur: 0.3 + dist * 0.05, arc: 0.7 + dist * 0.12, pos: new THREE.Vector3() });
              h.throws = (h.throws || 0) + 1;
            } else if (b) { b.inc--; if (b.reserved && b.reservedBy === h) { b.reserved = false; C.pile.inc--; } }
          }
          if (h.throwT >= 1) h.throwT = -1;
        }
        if (h.cd <= 0 && h.throwT < 0 && h.pop >= 1 && !h.want) {
          if (pileFull) { h.cd = 0.4; h.rest = Math.min(1, h.rest + 0.4); continue; }
          let best = null, bestD = 1e9;
          for (const b of blocks) {
            if (b.dead || b.deco || b.hp - b.inc <= 0) continue;
            const dz = b.z - h.z;
            if (dz < -3.2 || dz > 2.6) continue;
            const d = Math.abs(dz + 0.6) + b.lane * 0.2;
            if (d < bestD) { bestD = d; best = b; }
          }
          if (best) {
            best.inc++;
            if (best.hp - best.inc <= 0) {
              if (C.pile.n + C.pile.inc >= C.pile.max) { best.inc--; h.cd = 0.3; continue; }
              best.reserved = true; best.reservedBy = h; C.pile.inc++;
            }
            h.target = best; h.throwT = 0; h.launched = false; h.rest = 0;
            h.cd = CFG.throwPeriod * rand(0.85, 1.15);
          } else h.cd = 0.25;
        }
        // Wurfbewegung
        const t = h.throwT >= 0 ? h.throwT : -1;
        let arm = 0;
        if (t >= 0) arm = t < 0.45 ? -2.6 * (t / 0.45) : -2.6 + 3.2 * Math.min(1, (t - 0.45) / 0.25);
        if (t >= 0.7) arm = 0.6 * (1 - (t - 0.7) / 0.3);
        h.fr.rotation.x = arm;
        h.fl.rotation.z = -0.35 - Math.sin(time * 3 + h.i) * 0.08;
        const pop = h.pop < 1 ? 1 + Math.sin(h.pop * Math.PI) * 0.35 : 1;
        const sc = Math.min(1, h.pop * 1.4) * pop;
        h.root.scale.setScalar(Math.max(0.001, sc) * 1.1);
        h.body.position.y = Math.abs(Math.sin(time * 4 + h.i)) * 0.03;
        h.body.rotation.z = Math.sin(time * 2 + h.i) * 0.04;
      }
      for (let i = snowballs.length - 1; i >= 0; i--) {
        const s = snowballs[i]; s.t += dt / s.dur;
        const b = s.b, k = Math.min(1, s.t);
        s.pos.set(lerp(s.from.x, b.x, k), lerp(s.from.y, b.y + 0.5, k) + Math.sin(k * Math.PI) * s.arc, lerp(s.from.z, b.z, k));
        if (s.t >= 1) {
          snowballs.splice(i, 1);
          b.inc--;
          if (b.dead) continue;
          b.hp--; b.shake = 1;
          burstParticles(b.x, b.y + 0.6, b.z, 5, 0xffffff, 1.4, 0.07, 0.35, 5);
          sfx.hit();
          if (b.hp <= 0) burst(b);
        }
      }
    }

    // Wartende stehen hinter der letzten offenen Theke
    const waitPos = (k) => ({ x: L.laneX, z: (S.counter2 ? L.counter2.z : L.counter.z) + (k + 1) * L.qGap });
    function serve(w, fc, dt) {
      fc.serveCd -= dt;
      if (fc.got + fc.inc < fc.want && w.stack.n > 0 && fc.serveCd <= 0) {
        fc.serveCd = CFG.servePeriods[S.machine];
        fc.inc++;
        const from = w.pos(w.stack.n - 1); w.stack.n--;
        const ctype = w.types.pop() || 'cone'; // die oberste Eistüte
        fly(ctype, from, () => _v.set(fc.x, 1.15 * fc.scale, fc.z), 0.3, 0.8, () => {
          fc.inc--; fc.got++; sfx.drop(fc.got); S.sold++;
          fc.pay += ctype === 'bcone' ? CFG.coinPerBlue : ctype === 'ccone' ? CFG.coinPerChoc : CFG.coinPerCone; fc.lastType = ctype;
          if (ctype === 'ccone' && ++S.chocSold === 1) placeUnlocks();
          if (ctype === 'bcone' && ++S.blueSold === 1) placeUnlocks();
          if (fc.got >= fc.want) {
            fc.state = 'leave'; fc.happy = 1; fc.leaveStep = 0; fc.exit = w.exit; w.cust = null; sfx.happy();
            burstParticles(fc.x, 1.4, fc.z, 6, 0xff8fb0, 1.6, 0.09, 0.7, 2);
            for (let i = 0; i < fc.pay; i++) {
              const j = C.coinPile.n + C.coinPile.inc; C.coinPile.inc++;
              fly('coin', new THREE.Vector3(fc.x, 0.9, fc.z), () => coinPos(Math.min(j, 134)), 0.45, 1.4, () => { C.coinPile.inc--; C.coinPile.n++; sfx.coin(); }, i * 0.05);
            }
          }
        });
      }
    }
    function updateCustomers(dt, time) {
      // freie Theke? -> nächstes Tier aus der Schlange
      for (const w of WINDOWS) {
        if (!w.open() || w.cust) continue;
        const next = customers.find((c) => c.state === 'queue');
        if (next) { next.state = 'atWindow'; next.win = w; next.serveCd = 0.15; w.cust = next; }
      }
      const queue = customers.filter((c) => c.state === 'queue');
      queue.forEach((c, k) => { c.slot = k; });
      // Nachschub: nie weniger als queueMin Tiere in der Schlange
      spawnT -= dt;
      if (queue.length < CFG.queueMax && (spawnT <= 0 || (queue.length < CFG.queueMin && spawnT < 999))) {
        spawnCustomer(false);
        const boost = (S.counter2 ? 1.6 : 1) * (1 + 0.35 * ((S.iceHelper ? 1 : 0) + (S.iceHelper2 ? 1 : 0)));
        spawnT = queue.length < CFG.queueMin ? 0.35 : CFG.spawnPeriods[S.machine] * (S.garden ? CFG.blueSpawnFactor : 1) * (S.island ? 0.8 : 1) / boost * rand(0.7, 1.3);
      }
      for (const c of customers) {
        let tx, tz, speed = CFG.customerSpeed;
        if (c.state === 'queue') { const q = waitPos(c.slot); tx = q.x; tz = q.z; }
        else if (c.state === 'atWindow') { tx = L.laneX; tz = c.win.z; speed = CFG.customerSpeed * 1.15; }
        else {
          const path = c.exit || WINDOWS[0].exit;
          const q = path[Math.min(c.leaveStep, path.length - 1)]; tx = q.x; tz = q.z; speed = CFG.customerSpeed * 1.1;
        }
        const dx = tx - c.x, dz = tz - c.z, d = Math.hypot(dx, dz);
        const moving = d > 0.05;
        if (moving) {
          const st = Math.min(d, speed * dt); c.x += (dx / d) * st; c.z += (dz / d) * st;
          const ty = Math.atan2(dx, dz); let dy = ty - c.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); c.yaw += dy * Math.min(1, dt * 10);
          c.hop += dt * 11;
        } else if (c.state === 'leave') {
          c.leaveStep++;
          if (c.leaveStep >= (c.exit || WINDOWS[0].exit).length) c.remove = true;
        }
        if (!moving && c.state !== 'leave') {
          // Wartende schauen zur Kamera, wer an der Theke steht, halb zur Theke
          let dy = (c.state === 'atWindow' ? -Math.PI / 4 : Math.PI / 4) - c.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); c.yaw += dy * Math.min(1, dt * 7);
        }
        if (c.state === 'atWindow' && d < 0.3) serve(c.win, c, dt);
        c.happy = Math.max(0, c.happy - dt * 1.6);
        const bob = moving ? Math.abs(Math.sin(c.hop)) * 0.09 : 0;
        const jump = c.happy > 0 ? Math.sin((1 - c.happy) * Math.PI * 2) * 0.35 : 0;
        c.root.position.set(c.x, bob + Math.max(0, jump), c.z);
        c.root.rotation.y = c.yaw;
        c.body.rotation.z = moving ? Math.sin(c.hop) * 0.07 : Math.sin(time * 2 + c.id) * 0.03;
      }
      // Sprechblasen: wie viele Eis will das Tier an der Theke noch?
      WINDOWS.forEach((w, i) => {
        const b = bubbles[i], c = w.cust;
        const left = c ? c.want - c.got - c.inc : 0;
        if (c && left > 0 && Math.abs(c.z - w.z) < 0.5) {
          drawBubble(b, left); b.sp.visible = true;
          b.sp.position.set(c.x, 2.2 * c.scale + Math.sin(time * 3 + i) * 0.05, c.z);
        } else b.sp.visible = false;
      });
      for (let i = customers.length - 1; i >= 0; i--) {
        if (customers[i].remove) { scene.remove(customers[i].root); customers.splice(i, 1); }
      }
    }

    function updateFlies(dt) {
      for (let i = flies.length - 1; i >= 0; i--) {
        const f = flies[i]; f.t += dt / f.dur;
        if (f.t < 0) continue;
        const to = f.to(), k = Math.min(1, f.t), e = k * k * (3 - 2 * k);
        f.pos.set(lerp(f.from.x, to.x, e), lerp(f.from.y, to.y, e) + Math.sin(k * Math.PI) * f.arc, lerp(f.from.z, to.z, e));
        if (f.t >= 1) { flies.splice(i, 1); if (f.done) f.done(); }
      }
    }

    function updateParticles(dt) {
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i]; p.t += dt;
        if (p.t >= p.life) { parts.splice(i, 1); continue; }
        p.vy -= p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
        if (p.y < 0.05) { p.y = 0.05; p.vy *= -0.3; p.vx *= 0.6; p.vz *= 0.6; }
      }
    }

    /* Hinweise: wohin als Nächstes? */
    function nextGoal() {
      const carry = C.carry;
      if (trouble.machine) return { t: trouble.machine.at, icon: 'upgrade', text: (trouble.machine.name || 'Maschine') + ' kaputt! Reparatur: ' + trouble.repair, urgent: true };
      if (trouble.worker) return { t: trouble.worker, icon: 'muenze', text: 'Ein Helfer will ' + trouble.cost + ' Münzen!', urgent: true };
      // Hände voller Erdbeeren, Maschine und Ausgabe voll: nur das Eisloch hilft weiter
      if (carry.type === 'berry' && C.hopper.n + C.hopper.inc >= C.hopper.max && C.out.n + C.out.inc >= C.out.max)
        return { t: tiles.hole, icon: 'erdbeere', text: 'Maschine voll! Wirf sie ins Eisloch!', urgent: true };
      if (carry.type === 'pod' && K.hopper.n + K.hopper.inc >= K.hopper.max && K.out.n + K.out.inc >= K.out.max)
        return { t: tiles.hole3, icon: 'kakao', text: 'Maschine voll! Wirf sie ins Eisloch!', urgent: true };
      if (S.island && S.chocSold === 0 && !['berry', 'cone', 'blue', 'bcone'].includes(carry.type)) {
        if (carry.type === 'pod') return { t: tiles.chocInput, icon: 'kakao', text: 'Ab in die Schoko-Maschine!', urgent: true };
        if (carry.type === 'ccone') return { t: (bestWindow() || WINDOWS[0]).drop, icon: 'eistuete-schoko', text: 'Schoko-Eis bringt 15 Münzen!', urgent: true };
        if (K.out.n > 0) return { t: tiles.chocOutput, icon: 'eistuete-schoko', text: 'Hol das Schoko-Eis!', urgent: true };
        if (K.hopper.n + K.hopper.inc === 0) { const b = cocoaTrees.find((b) => b.n > 0); if (b) return { t: b, icon: 'kakao', text: 'Pflück Kakao auf der Insel!', urgent: true }; }
      }
      if (carry.type === 'pod') return { t: tiles.chocInput, icon: 'kakao', text: 'Ab in die Schoko-Maschine!' };
      if (carry.type === 'ccone') return { t: (bestWindow() || WINDOWS[0]).drop, icon: 'eistuete-schoko', text: 'Bring das Eis zur Theke!' };
      if (carry.type === 'blue' && B.hopper.n + B.hopper.inc >= B.hopper.max && B.out.n + B.out.inc >= B.out.max)
        return { t: tiles.hole2, icon: 'blaubeere', text: 'Maschine voll! Wirf sie ins Eisloch!', urgent: true };
      // Blaubeer-Garten: zeigen, wie es geht, bis das erste Blaubeer-Eis verkauft ist
      if (S.garden && S.blueSold === 0 && carry.type !== 'berry' && carry.type !== 'cone') {
        if (carry.type === 'blue') return { t: tiles.blueInput, icon: 'blaubeere', text: 'Ab in die Blaubeer-Maschine!', urgent: true };
        if (carry.type === 'bcone') return { t: tiles.drop, icon: 'eistuete-blau', text: 'Blaubeer-Eis bringt 9 Münzen!', urgent: true };
        if (B.out.n > 0) return { t: tiles.blueOutput, icon: 'eistuete-blau', text: 'Hol das Blaubeer-Eis!', urgent: true };
        if (B.hopper.n + B.hopper.inc === 0) { const b = bushes.find((b) => b.n > 0); if (b) return { t: b, icon: 'blaubeere', text: 'Pflück Blaubeeren am Busch!', urgent: true }; }
      }
      if (carry.type === 'blue') return { t: tiles.blueInput, icon: 'blaubeere', text: 'Ab in die Blaubeer-Maschine!' };
      if (carry.type === 'bcone') return { t: (bestWindow() || WINDOWS[0]).drop, icon: 'eistuete-blau', text: 'Bring das Eis zur Theke!' };
      if (carry.type === 'berry') return { t: tiles.input, icon: 'erdbeere', text: 'Bring die Erdbeeren zur Eismaschine!' };
      if (carry.type === 'cone') return { t: (bestWindow() || WINDOWS[0]).drop, icon: 'eistuete', text: 'Bring das Eis zur Theke!' };
      if (C.coinPile.n > 0) return { t: tiles.coin, icon: 'muenze', text: 'Sammle die Münzen ein!' };
      for (const u of UNLOCKS) if (u.tile.mesh.visible && S.coins + S[u.key] >= u.price()) return { t: u.tile, icon: u.icon, text: u.text };
      if (C.out.n > 0) return { t: tiles.output, icon: 'eistuete', text: 'Hol das fertige Eis!' };
      if (C.pile.n > 0 && !S.carrier) return { t: tiles.pile, icon: 'erdbeere', text: 'Hol die Erdbeeren vom Steg!' };
      return null;
    }
    function updateGuide(time) {
      const goal = playing ? nextGoal() : null;
      const showArrow = goal && (!S.tutDone || idleT > 6 || goal.urgent);
      if (showArrow) {
        arrow.visible = true;
        arrow.position.set(goal.t.x, 1.3 + Math.abs(Math.sin(time * 4)) * 0.45, goal.t.z);
      } else arrow.visible = false;
      if (playing && goal && (!S.tutDone || goal.urgent)) setHint(goal.icon, goal.text);
      else setHint('', '');
    }

    /* ---------- Zeichnen der Gegenstände ---------- */
    function drawItems(time) {
      berryIM.count = coneIM.count = coinIM.count = blueIM.count = bconeIM.count = podIM.count = cconeIM.count = 0;
      shadowIM.count = snowballIM.count = partIM.count = iceIM.count = 0;
      const v = new THREE.Vector3();
      for (let i = 0; i < C.pile.n; i++) { pilePos(i, v); put(berryIM, v.x, v.y, v.z, i * 2.1, 1); }
      for (let i = 0; i < C.out.n; i++) { outPos(i, v); put(coneIM, v.x, v.y, v.z, i * 0.7, 1); }
      for (let i = 0; i < C.counter.n; i++) { counterPos(i, v); put(ITEM[counterTypes[i]] || coneIM, v.x, v.y, v.z, i * 0.9, 1); }
      for (let i = 0; i < C.counter2.n; i++) { counter2Pos(i, v); put(ITEM[counter2Types[i]] || coneIM, v.x, v.y, v.z, i * 0.9, 1); }
      for (let i = 0; i < B.out.n; i++) { blueOutPos(i, v); put(bconeIM, v.x, v.y, v.z, i * 0.7, 1); }
      for (let i = 0; i < K.out.n; i++) { chocOutPos(i, v); put(cconeIM, v.x, v.y, v.z, i * 0.7, 1); }
      for (const b of cocoaTrees) for (let i = 0; i < b.n; i++) { treePodPos(b, i, v); put(podIM, v.x, v.y - 0.2, v.z, i * 1.1, 1); }
      for (const b of bushes) for (let i = 0; i < b.n; i++) { bushBerryPos(b, i, v); put(blueIM, v.x, v.y - 0.12, v.z, i * 1.3, 0.95); }
      const nc = Math.min(C.coinPile.n, 135);
      for (let i = 0; i < nc; i++) { coinPos(i, v); put(coinIM, v.x, v.y, v.z, i * 0.37, 1, 0, (i % 3 - 1) * 0.05); }
      const im = ITEM[C.carry.type];
      if (im) for (let i = 0; i < C.carry.n; i++) { stackPos(i, v); put(im, v.x, v.y, v.z, player.yaw + (C.carry.type === 'berry' || C.carry.type === 'blue' || C.carry.type === 'pod' ? i * 1.7 : 0), 1, -player.leanZ * 0.5); }
      for (const cr of couriers) if (cr.on) for (let i = 0; i < cr.load.n; i++) { cr.stackPos(i, v); put(ITEM[cr.loadItem || cr.o.item], v.x, v.y, v.z, cr.yaw + i * 1.9, 0.85); }
      for (const f of flies) if (f.t >= 0) put(ITEM[f.type], f.pos.x, f.pos.y, f.pos.z, f.rot + f.t * 5, 1);
      // Kunden, die mit Eis weggehen
      for (const c of customers) if (c.state === 'leave') {
        const cx = Math.cos(c.yaw), sx = Math.sin(c.yaw);
        put(ITEM[c.lastType] || coneIM, c.root.position.x + sx * 0.35 + cx * 0.22, c.root.position.y + 0.55 * c.scale, c.root.position.z + cx * 0.35 - sx * 0.22, c.yaw, 0.9);
      }
      // Eisblöcke im Fluss
      for (const b of blocks) {
        const sh = b.shake, ox = sh ? rand(-0.06, 0.06) * sh : 0, oz = sh ? rand(-0.06, 0.06) * sh : 0;
        const em = clamp((b.z - (b.born == null ? SPAWN_Z : b.born)) / EMERGE, 0, 1), eme = em * em * (3 - 2 * em);
        const y = b.y + Math.sin(b.phase) * 0.06 - (1 - eme) * 0.8, s = b.s * (1 + sh * 0.08) * (0.55 + 0.45 * eme);
        put(iceIM, b.x + ox, y + 0.38 * b.s, b.z + oz, b.rot + Math.sin(b.phase * 0.5) * 0.05, s * 0.95);
        if (!b.deco) put(berryIM, b.x + ox, y + 0.08, b.z + oz, b.rot + time * 0.3, 1.6);
      }
      for (const s of snowballs) put(snowballIM, s.pos.x, s.pos.y, s.pos.z, 0, 0.13);
      for (const p of parts) {
        const k = 1 - p.t / p.life;
        put(partIM, p.x, p.y, p.z, 0, p.size * (0.4 + 0.6 * k));
        partIM.setColorAt(partIM.count - 1, _col.setHex(p.color));
      }
      // Schatten
      const sh = (x, z, s) => put(shadowIM, x, 0.035, z, 0, s, -Math.PI / 2);
      sh(player.x, player.z, 1.1);
      for (const h of helpers) sh(h.x, h.z, 1.0 * h.root.scale.x);
      for (const cr of couriers) if (cr.on) sh(cr.x, cr.z, 1.0 * cr.root.scale.x);
      for (const c of customers) sh(c.root.position.x, c.root.position.z, 1.15 * c.scale);
      [berryIM, coneIM, coinIM, blueIM, bconeIM, podIM, cconeIM, shadowIM, snowballIM, partIM, iceIM].forEach((m) => { m.instanceMatrix.needsUpdate = true; });
      if (partIM.instanceColor) partIM.instanceColor.needsUpdate = true;
    }

    function animateKid(time) {
      kid.position.set(player.x, Math.abs(Math.sin(player.walk)) * 0.06 * player.move, player.z);
      kid.rotation.y = player.yaw;
      const m = player.move, w = player.walk;
      kidLegL.rotation.x = Math.sin(w) * 0.7 * m; kidLegR.rotation.x = -Math.sin(w) * 0.7 * m;
      const carrying = C.carry.n + C.carry.inc > 0;
      if (carrying) {
        kidArmL.rotation.set(-1.25, 0, -0.12); kidArmR.rotation.set(-1.25, 0, 0.12);
      } else {
        kidArmL.rotation.set(-Math.sin(w) * 0.55 * m, 0, -0.18 - (1 - m) * 0.05 * Math.sin(time * 2));
        kidArmR.rotation.set(Math.sin(w) * 0.55 * m, 0, 0.18 + (1 - m) * 0.05 * Math.sin(time * 2));
      }
      kidBodyMesh.rotation.x = 0.07 * m;
    }

    /* ---------- Kamera ---------- */
    let viewW = 12.5, viewH = 20;
    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      const aspect = w / h;
      if (aspect < 0.8) { viewW = 10.8; viewH = viewW / aspect; } else { viewH = 15; viewW = viewH * aspect; }
      camera.left = -viewW / 2; camera.right = viewW / 2; camera.top = viewH / 2; camera.bottom = -viewH / 2;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();
    function updateCamera(dt, snap) {
      // Folgt dem Kind nur ein Stück, die ganze Eisdiele bleibt im Bild
      let u = (player.x - player.z) * SQ, v = (player.x + player.z) * SQ;
      u = S.island && player.x < L.bankX ? clamp(u * 1.0, -20, 2.6) : clamp(u * 0.7, S.garden ? -7.5 : -2.4, 2.6); // auf der Insel enger folgen v = clamp(v * 0.6 - 0.6, -4.2, 3.4); // im Garten weiter nach links
      const tx = (u + v) * SQ, tz = (v - u) * SQ;
      if (snap) camT.set(tx, 0, tz); else { camT.x = damp(camT.x, tx, 3, dt); camT.z = damp(camT.z, tz, 3, dt); }
      camera.position.copy(camT).addScaledVector(CAM_DIR, 60);
      camera.lookAt(camT);
    }

    /* ---------- Schleife ---------- */
    let last = performance.now(), time = 0, saveT = 0;
    updateCamera(0, true);
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (!paused) {
        time += dt;
        if (playing) { updatePlayer(dt); updateInteractions(dt); }
        updateMachine(dt);
        updateBlocks(dt);
        updateHelpers(dt, time);
        updateCarrier(dt, time);
        updateCustomers(dt, time);
        updateFlies(dt);
        updateParticles(dt);
        updateGuide(time);
        animateKid(time);
        updateCamera(dt, false);
        waterTex.offset.y -= dt * 0.06;
        for (const w of holeWaters) w.rotation.z += dt * 0.35;
        saveT += dt; if (playing && saveT > 4) { saveT = 0; save(); }
      }
      drawItems(time);
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    window.addEventListener('pagehide', save);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { save(); input.active = false; els.joy.hidden = true; input.keys = {}; }
      last = performance.now();
    });

    if (/[?&]debug\b/.test(location.search)) {
      window.__eis = {
        S, C, RC, B, K, trouble, workers, cocoaTrees, cocoaHelper, bushes, counterTypes, counter2Types, WINDOWS, iceHelper, iceHelper2, couriers, picker, carrier, UNLOCKS, player, tiles, helpers, customers, blocks, L, placeUnlocks,
        go(x, z) { player.x = x; player.z = z; },
        begin, save, cam() { updateCamera(0, true); },
        step(sec, fn) { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) { if (fn) fn(); const dt = 1 / 60; time += dt; updatePlayer(dt); updateInteractions(dt); updateMachine(dt); updateBlocks(dt); updateHelpers(dt, time); updateCarrier(dt, time); updateCustomers(dt, time); updateFlies(dt); updateParticles(dt); } }
      };
    }
  }

  boot();
})();
</script>
