:root{color-scheme:light;--ink:#11121A;--brand:#FF9200;--act:#FFD21C;--glass:rgba(255,255,255,.9);--lav:#8c6bd6;font-family:"Fredoka","Barlow",system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{width:100%;height:100%;margin:0;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
body{background:#cfe6ff;color:var(--ink)}
.pz-home{position:fixed;z-index:2147483000;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(17,18,26,.72);color:#f6f7f9;border:1px solid rgba(246,247,249,.25);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-decoration:none}
.pz-home:focus-visible{outline:3px solid #FFD21C;outline-offset:2px}
#app{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,calc(100dvh * .62));overflow:hidden;background:#cfe6ff}
@supports not (height:100dvh){#app{width:min(100vw,calc(100vh * .62))}}
#game{position:absolute;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 10px 0 60px;display:flex;gap:6px;align-items:center;pointer-events:none;z-index:3;transition:opacity .2s}
#hud.off{opacity:0;visibility:hidden}
.chip{height:40px;min-width:40px;padding:0 11px;border-radius:14px;background:var(--glass);box-shadow:0 2px 8px rgba(17,18,26,.18);display:flex;align-items:center;gap:6px;font-weight:700;font-size:19px;white-space:nowrap}
#chipLevel{background:var(--ink);color:#fff}
#chipLevel svg{width:18px;height:18px;color:var(--brand)}
#chipStars{gap:2px;padding:0 8px}
#chipStars svg{width:22px;height:22px}
#btnPause{margin-left:auto;pointer-events:auto;width:44px;height:44px;border:0;border-radius:14px;background:var(--glass);box-shadow:0 2px 8px rgba(17,18,26,.18);display:grid;place-items:center}
#btnPause svg{width:22px;height:22px}
/* Tipp zu Levelbeginn */
#tip{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;max-width:calc(100% - 24px);top:calc(env(safe-area-inset-top,0px) + 62px);z-index:3;display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:18px;background:rgba(255,255,255,.95);box-shadow:0 4px 14px rgba(17,18,26,.22);font-weight:600;font-size:16px;line-height:1.2;pointer-events:none;transition:opacity .35s,transform .35s}
#tip.away{opacity:0;transform:translateY(-12px)}
#tip .ic{font-size:26px}
#tip small{display:block;font-size:12px;font-weight:600;opacity:.6}
/* Bildschirme */
.screen{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 64px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);background:rgba(40,30,80,.42);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);color:#fff;text-align:center;overflow:auto}
.screen[hidden]{display:none}
#start{background:linear-gradient(#a9d4ff 0%,#d9c8ff 55%,#ffd6ec 100%);color:var(--ink)}
.title{margin:0;font-weight:700;font-size:clamp(42px,13vw,58px);line-height:.95;color:#fff;text-shadow:0 4px 0 #b06ad8,0 6px 14px rgba(80,40,140,.35)}
.title small{display:block;font-size:.42em;color:#fff;text-shadow:0 2px 0 rgba(120,60,170,.55);margin-top:8px}
#hero{width:min(300px,76vw);height:auto;aspect-ratio:1/1;border-radius:28px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;min-width:190px;height:72px;padding:0 28px;border:0;border-radius:24px;background:var(--act);color:var(--ink);font-weight:700;font-size:28px;box-shadow:0 6px 0 #c99c00,0 10px 20px rgba(0,0,0,.22)}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #c99c00}
.big svg{width:34px;height:34px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sec{display:flex;align-items:center;gap:8px;height:52px;padding:0 16px;border:0;border-radius:18px;background:rgba(255,255,255,.94);color:var(--ink);font-weight:600;font-size:19px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.sec svg,.sec .ico{width:24px;height:24px;display:grid;place-items:center}
.sec .ico svg{width:24px;height:24px}
.round{width:52px;padding:0;justify-content:center;border-radius:16px}
#mStart{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px}
.panel{background:rgba(44,30,84,.88);border-radius:26px;padding:22px 18px;display:flex;flex-direction:column;gap:12px;align-items:stretch;width:min(320px,90vw);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.panel h2{margin:0 0 2px;font-size:30px;font-weight:700;color:#fff}
.panel .sec{justify-content:flex-start;height:58px;font-size:21px}
.panel .big{height:64px;font-size:24px}
.panel .round{width:58px;justify-content:center}
#win .panel{align-items:center}
.stars{display:flex;gap:6px;justify-content:center}
.stars svg{width:58px;height:58px;transition:transform .3s}
.stars svg.on{animation:pop .45s ease-out both}
@keyframes pop{0%{transform:scale(.3) rotate(-30deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.result{padding:8px 12px;border-radius:14px;font-weight:600;font-size:16px;line-height:1.3}
.result.win{background:#2fbf71;color:#fff}.result.lose{background:#ffe7a6;color:#7a4c26}
.challenge{margin:0;padding:12px;border-radius:18px;background:#fff1c9;border:3px dashed #e0a24a;font:600 16px/1.3 "Fredoka";color:#7a4c26;max-width:320px}
.challenge b{display:block;font-size:24px;color:#a2560a}
.konto{padding:12px;border-radius:18px;background:#fff3d6;border:2px dashed #e0a24a;display:grid;gap:6px;justify-items:center;font:600 14px/1.35 "Barlow";color:#7a4c26;max-width:320px}
.konto b{font:700 17px/1.1 "Fredoka";color:#a2560a}
.konto[hidden]{display:none}
.konto button{height:44px;padding:0 16px;border:0;border-radius:14px;background:var(--act);font-weight:700;font-size:16px;box-shadow:0 3px 0 #c99c00}
/* Levelauswahl */
#levels{justify-content:flex-start}
#levels h2{margin:0;font-size:30px}
.world{width:min(100%,360px);text-align:left;margin:6px 0 -4px;font-size:17px;font-weight:600;color:#fff;opacity:.92}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:min(100%,360px)}
.lvl{position:relative;aspect-ratio:1;border:0;border-radius:16px;background:var(--sc,#ffb347);color:var(--ink);font-weight:700;font-size:24px;box-shadow:0 4px 0 rgba(0,0,0,.25);display:grid;place-items:center;line-height:1}
.lvl small{position:absolute;left:0;right:0;bottom:4px;font-size:11px;font-weight:700;letter-spacing:-1px;color:#a2560a}
.lvl.next{outline:4px solid #fff;animation:pulse 1.4s ease-in-out infinite}
.lvl:disabled{background:#5d6479;color:#c9cde0;box-shadow:none;cursor:default}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.lvl.next{animation:none}}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);z-index:9;padding:10px 16px;border-radius:14px;background:var(--ink);color:#fff;font-weight:600;font-size:16px;max-width:calc(100% - 24px);text-align:center}
#toast[hidden]{display:none}
body:not(.ready) #btnPlay{opacity:.6;pointer-events:none}
